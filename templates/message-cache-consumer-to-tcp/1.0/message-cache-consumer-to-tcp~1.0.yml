      pipelineFlow:
        - type: block
          label: Message Cache
          icon: random
        - type: pipe
          children:
            - type: arrow
              forward: true
              pullBackward: true
            - type: block
              label: drop
              icon: trash-can
            - type: arrow
              forward: true
            - type: block
              label: filter
              icon: filter
            - type: arrow
              forward: true
            - type: block
              label: transform
              icon: shuffle
            - type: arrow
              forward: true
              pullForward: true
        - type: block
          icon: arrow-down-to-square
          label: "Forward to TCP Socket(s)"
      exceptions:
        # REF-AOD - Catch data conversion exceptions
        - catches:
            - "com.fasterxml.jackson.core.JsonParseException"
            - "com.fasterxml.jackson.core.io.JsonEOFException"
            - "org.yaml.snakeyaml.parser.ParserException"
          handled:
            type: constant
            expression: "true"
          use-original-message: true
          steps:
            # REF-OCY - Log the error
            - method: log
              level: ERROR
              message: "Error parsing body: ${body}. Caused by: ${exception.message}"
            - method: isslog
              message: "parentId=${exchange.properties[parentId]} | failed() | Error processing the body, please check the logs for more details. Exception=${exception.message}"
              type: failed
              queueSize: $[[uiMessageLimit]]
              writeToFile: $[[logFailed]]
              writeToDatabase: $[[logFailed]]
            - method: stop
        # REF-EJC - Catch generic exception
        - catches:
            - "java.lang.Exception"
          handled:
            type: constant
            expression: true
          steps:
            # REF- - Log the error
            - method: log
              level: ERROR
              message: "Error processing data: ${exception}"
            - method: isslog
              message: "parentId=${exchange.properties[parentId]} | failed() | Error processing the body, please check the logs for more details. Exception=${exception.message}"
              type: failed
              queueSize: $[[uiMessageLimit]]
              writeToFile: $[[logFailed]]
              writeToDatabase: $[[logFailed]]
            - method: stop
        # REF-M0L - Catch No payload
        - catches:
            - "org.apache.integration_hub.NoTypeConversionAvailableException"
            - "com.fasterxml.jackson.databind.exc.MismatchedInputException"
          handled:
            type: constant
            expression: true
          steps:
            # REF- - Log the error
            - method: log
              level: ERROR
              message: "No content in the payload: ${exception}"
            - method: isslog
              message: "parentId=${exchange.properties[parentId]} | failed() | No content in body. Exception=${exception.message}"
              type: failed
              queueSize: $[[uiMessageLimit]]
              writeToFile: $[[logFailed]]
              writeToDatabase: $[[logFailed]]
            - method: stop
        # REF-XAG - Failed to send on socket
        - catches:
            - "java.net.ConnectException"
          handled:
            type: constant
            expression: true
          steps:
            # REF- - Log the error
            - method: log
              level: "ERROR"
              message: "Failed to send body to ${exchangeProperty.destinationHost}"
            # REF-4KD - Write log message to failed file
            - method: isslog
              message: "parentId=${exchange.properties[parentId]} | failed(${exchange.properties['filterExpression']}) | [dest=${exchangeProperty.destinationHost}, message=${exchange.properties['internalProcessedMessage']}]"
              type: failed
              queueSize: $[[uiMessageLimit]]
              writeToFile: $[[logFailed]]
              writeToDatabase: $[[logFailed]]
            - method: stop
        - catches:
            - "org.apache.integration_hub.processor.ThrottlerRejectedExecutionException"
          handled:
            type: constant
            expression: true
          steps:
            # REF- - Log the error
            - method: log
              level: "ERROR"
              message: "Throttle limit reached, dropping message: ${exception}"
            - method: isslog
              message: "dropped | ${exception}"
              type: dropped
              writeToFile: $[[logDropped]]
              writeToDatabase: $[[logDropped]]
              queueSize: $[[uiMessageLimit]]
            - method: stop
        - catches:
            - "org.apache.kafka.common.errors.TimeoutException"
          handled:
            type: constant
            expression: true
          steps:
            - method: log
              level: ERROR
              message: "Failed to send the body: ${exception.stacktrace}"
            - method: isslog
              message: "correlationId=${headers.correlationId} | failed | TimeoutException [destination=${exchangeProperty.destinationHost}, message=${exchange.properties['internalProcessedMessage']}]"
              type: failed
              queueSize: $[[uiMessageLimit]]
              writeToFile: $[[logFailed]]
              writeToDatabase: $[[logFailed]]
            - method: stop
      steps:
        - method: from
          component: kafka
          properties:
            brokers: $[[messageCacheBrokers]]
            topic: $[[topicName]]
            groupId: $[[groupName]]
            securityProtocol: SASL_SSL
            sslContextParameters: "$[[sslContextParameters]]"
            saslMechanism: PLAIN
            saslJaasConfig: "org.apache.kafka.common.security.plain.PlainLoginModule required username=$[[messageCacheUsername]] password=$[[messageCachePassword]];"
        - method: setProperty
          key: dateCreated
          value:
            type: groovy
            expression: |
              import java.time.LocalDateTime
              import java.time.format.DateTimeFormatter
              def now = LocalDateTime.now()
              def formattedDate = now.format(DateTimeFormatter.ofPattern("yyyy-MM-dd HH:mm:ss.SSS"))
              return formattedDate
        - method: throttle
          # disabled: $[[throttleEnabled]]
          count: $[[throttleCount]]
          period: $[[throttlePeriod]]
          rejectExecution: true
        # REF-B9G - Store incoming message as "internalOrigMsg" property
        - method: setProperty
          key: internalOrigMsg
          value:
            type: "simple"
            expression: "${body}"
        # REF- - Set header "requestId" to the initial "parent" correlationId
        - method: setProperty
          key: parentId
          value:
            type: "simple"
            expression: "${exchangeId}"
        - method: setHeader
          key: topic
          value:
            type: simple
            expression: "${headers[kafka.TOPIC]}"
        - method: setHeader
          key: groupName
          value:
            type: simple
            expression: "$[[groupName]]"
        - method: setHeader
          key: partition
          value:
            type: simple
            expression: "${headers[kafka.PARTITION]}"
        - method: setHeader
          key: offset
          value:
            type: simple
            expression: "${headers[kafka.OFFSET]}"
        - method: setHeader
          key: key
          value:
            type: simple
            expression: "${headers[kafka.KEY]}"
        # REF- - Store headers in exchange
        - method: process
          classname: com.interlinksoftware.integrationhub.config.step.processor.HeadersToPropertyProcessor
        # REF- - Debug message
        - method: log
          level: "DEBUG"
          message: "Writing body to received file"
        # REF-H9Z - Log message to file
        - method: isslog
          message: "received | ${bodyAs(String)}"
          type: received
          queueSize: $[[uiMessageLimit]]
          writeToFile: $[[logReceived]]
          writeToDatabase: $[[logReceived]]
        # REF- - Set body to origin message
        - method: setBody
          expression:
            type: simple
            expression: "${exchangeProperty.internalOrigMsg}"
        - method: choice
          when:
            - predicate:
                type: simple
                expression: "${exchangeProperty.placeholders[preprocessHeaders]} != null && ${exchangeProperty.placeholders[preprocessHeaders]} != 'NOT_SET' && ${exchangeProperty.placeholders[preprocessHeaders]} is 'java.util.List' && ${exchangeProperty.placeholders[preprocessHeaders].size()} > 0"
              steps:
                - method: loop
                  expression:
                    type: simple
                    expression: "${exchangeProperty.placeholders[preprocessHeaders].size()}"
                  copy: false
                  steps:
                    - method: choice
                      when:
                        - predicate:
                            type: simple
                            expression: "${exchangeProperty.placeholders[preprocessHeaders].get(${header.Integration_HubLoopIndex}).getOrDefault(expression, NOT_SET)} != 'NOT_SET'"
                          steps:
                            - method: setProperty
                              key: preprocessHeaderExpression
                              value:
                                type: "simple"
                                expression: "${exchangeProperty.placeholders[preprocessHeaders].get(${header.Integration_HubLoopIndex})[expression]}"
                            - method: choice
                              when:
                                - predicate:
                                    type: simple
                                    expression: "${exchangeProperty.placeholders[preprocessHeaders].get(${header.Integration_HubLoopIndex}).getOrDefault(headers, NOT_SET)} != 'NOT_SET' && ${exchangeProperty.placeholders[preprocessHeaders].get(${header.Integration_HubLoopIndex})[headers]} is 'java.util.Map'"
                                  steps:
                                    - method: choice
                                      when:
                                        - predicate:
                                            type: groovy
                                            expression: |
                                              preprocessHeaderExpression = exchange.properties.get("preprocessHeaderExpression")
                                              language = exchange.getContext().resolveLanguage("simple")
                                              predicate = language.createPredicate(preprocessHeaderExpression)
                                              return predicate.matches(exchange);
                                          steps:
                                            - method: log
                                              level: "DEBUG"
                                              message: "Preprocess header expression(${exchangeProperty.preprocessHeaderExpression}) matches!!"
                                            - method: setBody
                                              expression:
                                                type: simple
                                                expression: "${exchangeProperty.placeholders[preprocessHeaders].get(${header.Integration_HubLoopIndex})[headers]}"
                                            - method: process
                                              classname: com.interlinksoftware.integrationhub.config.step.processor.BodyToHeadersProcessor
                                      otherwise:
                                        - method: log
                                          level: "DEBUG"
                                          message: "Preprocess header expression(${exchangeProperty.preprocessHeaderExpression}) does not match"
                              otherwise:
                                - method: log
                                  level: "ERROR"
                                  message: "No headers for expression(exchangeProperty.preprocessHeaderExpression) in preprocessor definition '(${header.Integration_HubLoopIndex})'"
                      otherwise:
                        - method: log
                          level: "ERROR"
                          message: "No expression in preprocessor definition '${header.Integration_HubLoopIndex}'"
          otherwise:
            - method: log
              level: "DEBUG"
              message: "No preprocessor definitions"
        # REF- - Set body to origin message
        - method: setBody
          expression:
            type: simple
            expression: "${exchangeProperty.internalOrigMsg}"
        # REF- - Handle regex list
        - method: choice
          when:
            - predicate:
                type: simple
                expression: "${exchangeProperty.placeholders[regexList]} != null && ${exchangeProperty.placeholders[regexList]} != 'NOT_SET' && ${exchangeProperty.placeholders[regexList]} is 'java.util.List' && ${exchangeProperty.placeholders[regexList].size()} > 0"
              steps:
                - method: loop
                  expression:
                    type: simple
                    expression: "${exchangeProperty.placeholders[regexList].size()}"
                  copy: false
                  steps:
                    - method: setProperty
                      key: regexListItem
                      value:
                        type: "simple"
                        expression: "${exchangeProperty.placeholders[regexList].get(${header.Integration_HubLoopIndex})}"
                    - method: setProperty
                      key: sanitizedBody
                      value:
                        type: groovy
                        expression: |
                          def previousBody = exchange.getProperty("sanitizedBody", String.class)
                          def currentBody = previousBody != null ? previousBody : exchange.getIn().getBody(String)

                          def regexListItem = exchange.properties.get("regexListItem")
                          def regexPattern = regexListItem.get("pattern")
                          def regexReplacement = regexListItem.get("replacement")

                          return currentBody.replaceAll(regexPattern, regexReplacement)
                    - method: setBody
                      expression:
                        type: "simple"
                        expression: "${exchangeProperty.sanitizedBody}"
        - method: choice
          when:
            - predicate:
                type: simple
                expression: "${exchangeProperty.placeholders[embeddedXmlToEscape]} != null && ${exchangeProperty.placeholders[embeddedXmlToEscape]} != 'NOT_SET'"
              steps:
                - method: log
                  level: "DEBUG"
                  message: "Escaping embedded XML"
                - method: convertBodyTo
                  type: String
                - method: setBody
                  expression:
                    type: groovy
                    expression: |
                      def placeholders = exchange.getProperty("placeholders", Map)
                      def xmlRoot = placeholders?.get("embeddedXmlToEscape")
                      def bodyStr = body

                      def startTag = "<${xmlRoot}>"
                      def endTag = "</${xmlRoot}>"

                      def startIdx = bodyStr.indexOf(startTag)
                      def endIdx = bodyStr.indexOf(endTag)

                      exchange.setProperty("xmlMatch", true)

                      if (startIdx == -1 || endIdx == -1) {
                          exchange.setProperty("xmlMatch", false)
                          return bodyStr
                      }

                      endIdx += endTag.length()
                      def originalXml = bodyStr.substring(startIdx, endIdx)

                      def escapedXml = originalXml.replaceAll('(?<!\\\\)"', '\\\\\"')

                      def before = bodyStr.substring(0, startIdx)
                      def after = bodyStr.substring(endIdx)
                      def updatedBody = before + escapedXml + after

                      return updatedBody
                - method: choice
                  when:
                    - predicate:
                        type: simple
                        expression: "${exchangeProperty.xmlMatch.toString()} != 'true'"
                      steps:
                        - method: isslog
                          message: "parentId=${exchange.properties[parentId]} | failed() | Could not find XML element: [${exchangeProperty.placeholders[embeddedXmlToEscape]}] in the body | ${bodyAs(String)}"
                          type: failed
                          queueSize: $[[uiMessageLimit]]
                          writeToFile: $[[logFailed]]
                          writeToDatabase: $[[logFailed]]
                        - method: stop
        # REF-4IZ - Data decoding
        - method: choice
          when:
            # REF-BEK
            - predicate:
                type: simple
                expression: "${header.Content-Encoding} in 'gzip,application/gzip'"
              steps:
                # REF- - Debug message
                - method: log
                  level: "DEBUG"
                  message: "decoding from gzip"
                - method: unmarshal
                  type: gzip
        # REF-1CY -  Datatype decoding
        - method: choice
          when:
            # REF-0KL - Unmarshal JSON
            - predicate:
                type: simple
                expression: "${header.Content-Type} ~~ 'json'"
              steps:
                # REF- - Debug message
                - method: log
                  level: "DEBUG"
                  message: "decoding from json"
                - method: unmarshal
                  type: json
                - method: choice
                  when:
                    - predicate:
                        type: simple
                        expression: "${body.getClass().getName()} == 'java.lang.String'"
                      steps:
                        - method: log
                          level: "DEBUG"
                          message: "decoding from json string - ${body.getClass().getName()}"
                        - method: unmarshal
                          type: json
                # Cache the unmarshalled body
                - method: setProperty
                  key: unmarshalledBody
                  value:
                    type: "simple"
                    expression: "${body}"
                # Append correlationId into the body
                - method: setBody
                  expression:
                    type: "groovy"
                    expression: |
                      if (body instanceof Map) {
                        body["correlationId"] = exchange.properties["parentId"]
                      }

                      if (body instanceof ArrayList) {
                        body.eachWithIndex { it, i ->
                          if (it instanceof Map) {
                            body[i]["correlationId"] = exchange.properties["parentId"]
                          }
                        }
                      }

                      return body
                # Convert the body back to its orig type
                - method: marshal
                  type: json
                # Cache this body for use later on in the template
                - method: setProperty
                  key: rawBody
                  value:
                    type: "simple"
                    expression: "${bodyAs(String)}"
            # REF-FU6 - Unmarshal XML
            - predicate:
                type: simple
                expression: "${header.Content-Type} ~~ 'xml'"
              steps:
                # REF- - Debug message
                - method: log
                  level: "DEBUG"
                  message: "decoding from xml"
                - method: unmarshal
                  type: xml
                # Cache the unmarshalled body
                - method: setProperty
                  key: unmarshalledBody
                  value:
                    type: "simple"
                    expression: "${body}"
                # Append correlationId into the body
                - method: setBody
                  expression:
                    type: "groovy"
                    expression: |
                      body["correlationId"] = exchange.properties["parentId"]
                      return body
                # Convert the body back to its orig type
                - method: marshal
                  type: xml
                # Cache this body for use later on in the template
                - method: setProperty
                  key: rawBody
                  value:
                    type: "simple"
                    expression: "${bodyAs(String)}"
            # REF-5JV - Unmarshal YAML
            - predicate:
                type: simple
                expression: "${header.Content-Type} ~~ 'yaml'"
              steps:
                # REF- - Debug message
                - method: log
                  level: "DEBUG"
                  message: "decoding from yaml"
                - method: unmarshal
                  type: yaml
                # Cache the unmarshalled body
                - method: setProperty
                  key: unmarshalledBody
                  value:
                    type: "simple"
                    expression: "${body}"
                # Append correlationId into the body
                - method: setBody
                  expression:
                    type: "groovy"
                    expression: |
                      body["correlationId"] = exchange.properties["parentId"]
                      return body
                # Convert the body back to its orig type
                - method: marshal
                  type: yaml
                # Cache this body for use later on in the template
                - method: setProperty
                  key: rawBody
                  value:
                    type: "simple"
                    expression: "${bodyAs(String)}"
          # REF-SCT - If datatype is unknown
          otherwise:
            # REF- - Debug message
            - method: log
              level: "DEBUG"
              message: "datatype '${header.Content-Type}' unknown"
            # REF- - Debug message
            - method: log
              level: "DEBUG"
              message: "writing to dropped file"
            # REF-4UJ - Write log message to file
            - method: isslog
              message: "parentId=${exchange.properties[parentId]} | missed(${header.ContentType}) | ${bodyAs(String)}"
              type: dropped
              queueSize: $[[uiMessageLimit]]
              writeToFile: $[[logDropped]]
              writeToDatabase: $[[logDropped]]
            # REF-0OP - Set header "Integration_HubHttpResponseCode" to 400
            - method: setHeader
              key: Integration_HubHttpResponseCode
              value:
                type: constant
                expression: 400
            # REF-JEF - Set Body to error message
            - method: setBody
              expression:
                type: simple
                expression: "Unknown datatype '${header.Content-Type}'\\n"
            # Stop processing any further
            - method: stop
        # Set the body back to the unmarshalled format
        - method: setBody
          expression:
            type: "simple"
            expression: "${exchangeProperty.unmarshalledBody}"
        - method: split
          resolve-maps-as-key-value: false
          expressions:
            - type: simple
              expression: "${body}"
          steps:
            # REF- - Handle allow list
            - method: choice
              when:
                - predicate:
                    type: simple
                    expression: "${exchangeProperty.placeholders[allowList]} != null && ${exchangeProperty.placeholders[allowList]} != 'NOT_SET' && ${exchangeProperty.placeholders[allowList]} is 'java.util.List' && ${exchangeProperty.placeholders[allowList].size()} > 0"
                  steps:
                    - method: loop
                      expression:
                        type: simple
                        expression: "${exchangeProperty.placeholders[allowList].size()}"
                      copy: false
                      steps:
                        - method: setProperty
                          key: allowListExpression
                          value:
                            type: "simple"
                            expression: "${exchangeProperty.placeholders[allowList].get(${header.Integration_HubLoopIndex})}"
                        - method: choice
                          when:
                            - predicate:
                                type: groovy
                                expression: |
                                  allowListExpression = exchange.properties.get("allowListExpression")
                                  language = exchange.getContext().resolveLanguage("simple")
                                  predicate = language.createPredicate(allowListExpression)
                                  return predicate.matches(exchange);
                              steps:
                                - method: log
                                  level: "DEBUG"
                                  message: "allowList expression(${exchangeProperty.allowListExpression}) matches"
                                - method: setProperty
                                  key: allowListCheck
                                  value:
                                    type: "constant"
                                    expression: true
                          otherwise:
                            - method: log
                              level: "DEBUG"
                              message: "allowList expression(${exchangeProperty.allowListExpression}) does not match"
                            - method: setProperty
                              key: allowListCheck
                              value:
                                type: groovy
                                expression: |
                                  prop = exchange.properties.getOrDefault("allowListCheck", "NOT_SET")
                                  if (prop == "NOT_SET") {
                                    return false;
                                  } else {
                                    return prop;
                                  }
              otherwise:
                - method: log
                  level: "DEBUG"
                  message: "No allowList definitions"
            - method: choice
              when:
                - predicate:
                    type: "simple"
                    expression: "${exchangeProperty.allowListCheck.toString()} =~ 'false'"
                  steps:
                    - method: log
                      level: "DEBUG"
                      message: "Message not allowed by allowList"
                    - method: isslog
                      message: "dropped | ${bodyAs(String)}"
                      type: dropped
                      writeToFile: $[[logDropped]]
                      writeToDatabase: $[[logDropped]]
                      queueSize: $[[uiMessageLimit]]
                    - method: setBody
                      expression:
                        type: simple
                        expression: '{ "status": "dropped", "requestId": "${exchangeId}"}'
                    - method: stop
            # REF- - Handle deny list
            - method: choice
              when:
                - predicate:
                    type: simple
                    expression: "${exchangeProperty.placeholders[denyList]} != null && ${exchangeProperty.placeholders[denyList]} != 'NOT_SET' && ${exchangeProperty.placeholders[denyList]} is 'java.util.List' && ${exchangeProperty.placeholders[denyList].size()} > 0"
                  steps:
                    - method: loop
                      expression:
                        type: simple
                        expression: "${exchangeProperty.placeholders[denyList].size()}"
                      copy: false
                      steps:
                        - method: setProperty
                          key: denyListExpression
                          value:
                            type: "simple"
                            expression: "${exchangeProperty.placeholders[denyList].get(${header.Integration_HubLoopIndex})}"
                        - method: choice
                          when:
                            - predicate:
                                type: groovy
                                expression: |
                                  denyListExpression = exchange.properties.get("denyListExpression")
                                  language = exchange.getContext().resolveLanguage("simple")
                                  predicate = language.createPredicate(denyListExpression)
                                  return predicate.matches(exchange);
                              steps:
                                - method: log
                                  level: "DEBUG"
                                  message: "denyList expression(${exchangeProperty.denyListExpression}) matches"
                                - method: setProperty
                                  key: denyListCheck
                                  value:
                                    type: "constant"
                                    expression: true
                          otherwise:
                            - method: log
                              level: "DEBUG"
                              message: "denyList expression(${exchangeProperty.denyListExpression}) does not match"
                            - method: setProperty
                              key: denyListCheck
                              value:
                                type: groovy
                                expression: |
                                  prop = exchange.properties.getOrDefault("denyListCheck", "NOT_SET")
                                  if (prop == "NOT_SET") {
                                    return false;
                                  } else {
                                    return prop;
                                  }
              otherwise:
                - method: log
                  level: "DEBUG"
                  message: "No denyList definitions"
            - method: choice
              when:
                - predicate:
                    type: "simple"
                    expression: "${exchangeProperty.denyListCheck.toString()} =~ 'true'"
                  steps:
                    - method: log
                      level: "DEBUG"
                      message: "Message not allowed by denyList"
                    - method: isslog
                      message: "dropped | ${bodyAs(String)}"
                      type: dropped
                      writeToFile: $[[logDropped]]
                      writeToDatabase: $[[logDropped]]
                      queueSize: $[[uiMessageLimit]]
                    - method: setBody
                      expression:
                        type: simple
                        expression: '{ "status": "dropped", "requestId": "${exchangeId}"}'
                    - method: stop
            # REF-IS2 - If the message matches a template key
            - method: choice
              when:
                - predicate:
                    type: simple
                    expression: "${exchangeProperty.placeholders[filters]} != null && ${exchangeProperty.placeholders[filters]} != 'NOT_SET' && ${exchangeProperty.placeholders[filters]} is 'java.util.List' && ${exchangeProperty.placeholders[filters].size()} > 0"
                  steps:
                    - method: setProperty
                      key: continueFilterLoop
                      value:
                        type: constant
                        expression: true
                    - method: setProperty
                      key: filterListSize
                      value:
                        type: simple
                        expression: "${exchangeProperty.placeholders[filters].size()}"
                    - method: doWhile
                      predicate:
                        type: simple
                        expression: "${exchangeProperty.continueFilterLoop}"
                      copy: false
                      steps:
                        - method: choice
                          when:
                            - predicate:
                                type: groovy
                                expression: |
                                  def loopIndex = exchange.properties.get('filterLoopIndex', "0") as int;
                                  def filterListSize = exchange.properties.get('filterListSize');

                                  if (loopIndex >= filterListSize) {
                                    // Exit from loop
                                    exchange.properties.put("continueFilterLoop", false)
                                    return false
                                  }

                                  def filters = exchange.properties.get('placeholders').get('filters')
                                  def filterExpression = filters[loopIndex].get('expression')

                                  exchange.properties.put("filterExpression", filterExpression)

                                  filterExpression = exchange.properties.get("filterExpression")
                                  language = exchange.getContext().resolveLanguage("simple")
                                  predicate = language.createPredicate(filterExpression)
                                  result = predicate.matches(exchange);
                                  exchange.properties.put("continueFilterLoop", !result)
                                  return result
                              steps:
                                - method: log
                                  level: "DEBUG"
                                  message: "filters expression(${exchangeProperty.filterExpression}) matches"
                                - method: setProperty
                                  key: filterCheck
                                  value:
                                    type: "constant"
                                    expression: true
                                - method: setProperty
                                  key: filterFormat
                                  value:
                                    type: "simple"
                                    expression: "${exchangeProperty.placeholders[filters].get(${exchangeProperty.filterLoopIndex}).getOrDefault('format', 'NOT_SET')}"
                                - method: choice
                                  when:
                                    - predicate:
                                        type: "simple"
                                        expression: "${exchangeProperty.filterFormat.toString()} == 'NOT_SET'"
                                      steps:
                                        - method: setProperty
                                          key: filterFormat
                                          value:
                                            type: "constant"
                                            expression: "${auto}"
                                - method: setProperty
                                  key: filterSplit
                                  value:
                                    type: "simple"
                                    expression: "${exchangeProperty.placeholders[filters].get(${exchangeProperty.filterLoopIndex}).getOrDefault('split', 'NOT_SET')}"
                                - method: choice
                                  when:
                                    - predicate:
                                        type: "simple"
                                        expression: "${exchangeProperty.filterSplit.toString()} == 'NOT_SET'"
                                      steps:
                                        - method: setProperty
                                          key: filterSplit
                                          value:
                                            type: "constant"
                                            expression: "${body}"
                                - method: setProperty
                                  key: filterStringifedJsonFields
                                  value:
                                    type: "simple"
                                    expression: "${exchangeProperty.placeholders[filters].get(${exchangeProperty.filterLoopIndex}).getOrDefault('stringifiedJsonFields', 'NOT_SET')}"
                                - method: setProperty
                                  key: filterStringifedXmlFields
                                  value:
                                    type: "simple"
                                    expression: "${exchangeProperty.placeholders[filters].get(${exchangeProperty.filterLoopIndex}).getOrDefault('stringifiedXmlFields', 'NOT_SET')}"
                                - method: setProperty
                                  key: filterFieldToMap
                                  value:
                                    type: "simple"
                                    expression: "${exchangeProperty.placeholders[filters].get(${exchangeProperty.filterLoopIndex}).getOrDefault('fieldToMap', 'NOT_SET')}"
                          otherwise:
                            - method: log
                              level: "DEBUG"
                              message: "filters expression(${exchangeProperty.filterExpression}) does not match"
                            - method: setProperty
                              key: filterCheck
                              value:
                                type: groovy
                                expression: |
                                  prop = exchange.properties.getOrDefault("filterCheck", "NOT_SET")
                                  if (prop == "NOT_SET") {
                                    return false;
                                  } else {
                                    return prop;
                                  }
                            - method: setProperty
                              key: filterLoopIndex
                              value:
                                type: "groovy"
                                expression: |
                                  def loopIndex = exchange.properties.get('filterLoopIndex') as int;
                                  return loopIndex + 1
              otherwise:
                - method: log
                  level: "DEBUG"
                  message: "No filters definitions"
                - method: setProperty
                  key: filterCheck
                  value:
                    type: "constant"
                    expression: false
            - method: choice
              when:
                - predicate:
                    type: "simple"
                    expression: "${exchangeProperty.filterCheck.toString()} =~ 'false'"
                  steps:
                    - method: setProperty
                      key: filterFormat
                      value:
                        type: "constant"
                        expression: "${auto}"
                    - method: setProperty
                      key: filterExpression
                      value:
                        type: "constant"
                        expression: "DEFAULT"
                    - method: setProperty
                      key: filterSplit
                      value:
                        type: "constant"
                        expression: "${body}"
            # REF- - Debug message
            - method: log
              level: "DEBUG"
              message: "body '${body}' has matched template statement '${exchangeProperty.filterExpression}'"
            # REF-8R9 - Set property "internalMatchFound" to true
            - method: setProperty
              key: internalMatchFound
              value:
                type: "constant"
                expression: true
            - method: log
              level: DEBUG
              message: "filterStringifedJsonFields value [${exchangeProperty.filterStringifedJsonFields}]"
            # Handle parsing field value into a map
            - method: choice
              when:
                - predicate:
                    type: groovy
                    expression: |
                      prop = exchange.properties.getOrDefault("filterFieldToMap", "NOT_SET")
                      if (prop == "NOT_SET") {
                        return false;
                      } else {
                        return true;
                      }
                  steps:
                    - method: setProperty
                      key: internalUnmarshalledMsg
                      value:
                        type: "simple"
                        expression: "${body}"
                    - method: loop
                      expression:
                        type: simple
                        expression: "${exchangeProperty.filterFieldToMap.size()}"
                      copy: true
                      steps:
                        - method: setProperty
                          key: fieldToMapIndex
                          value:
                            type: "simple"
                            expression: "${header.Integration_HubLoopIndex}"
                    - method: setProperty
                      key: parsedFields
                      value:
                        type: groovy
                        expression: |
                          def body = exchange.properties.get('internalUnmarshalledMsg')
                          def fieldsToParse = ['raw', 'otherField']
                          def mergedMap = [:]

                          fieldsToParse.each { fieldName ->
                            def rawStr = body[fieldName]
                            if (rawStr instanceof String) {
                              rawStr.split("\\|").each { part ->
                                def trimmed = part.trim()
                                def kv = trimmed.split("=", 2)
                                if (kv.length == 2) {
                                  def key = kv[0].trim()
                                  def value = kv[1].trim()
                                  mergedMap[key] = value
                                }
                              }
                            }
                          }

                          return mergedMap
            # Handle nested stringified json
            - method: choice
              when:
                - predicate:
                    type: groovy
                    expression: |
                      prop = exchange.properties.getOrDefault("filterStringifedJsonFields", "NOT_SET")
                      if (prop == "NOT_SET") {
                        return false;
                      } else {
                        return true;
                      }
                  steps:
                    - method: setProperty
                      key: internalUnmarshalledMsg
                      value:
                        type: "simple"
                        expression: "${body}"
                    - method: loop
                      expression:
                        type: simple
                        expression: "${exchangeProperty.filterStringifedJsonFields.size()}"
                      copy: true
                      steps:
                        - method: setProperty
                          key: filterStringifiedJsonIndex
                          value:
                            type: "simple"
                            expression: "${header.Integration_HubLoopIndex}"
                        - method: setBody
                          expression:
                            type: groovy
                            expression: |
                              field = exchange.properties.filterStringifedJsonFields.get(exchange.properties.filterStringifiedJsonIndex.toString())
                              return body.get(field)
                        - method: unmarshal
                          type: json
                        - method: setBody
                          expression:
                            type: groovy
                            expression: |
                              internalUnmarshalledMsg = exchange.properties.internalUnmarshalledMsg
                              field = exchange.properties.filterStringifedJsonFields.get(exchange.properties.filterStringifiedJsonIndex.toString())

                              internalUnmarshalledMsg.put(field.toString(), body)
                              return internalUnmarshalledMsg
            - method: log
              level: DEBUG
              message: "filterStringifedXmlFields value [${exchangeProperty.filterStringifedXmlFields}]"
            # Handle nested stringified xml
            - method: choice
              when:
                - predicate:
                    type: groovy
                    expression: |
                      prop = exchange.properties.getOrDefault("filterStringifedXmlFields", "NOT_SET")
                      if (prop == "NOT_SET") {
                        return false;
                      } else {
                        return true;
                      }
                  steps:
                    - method: setProperty
                      key: internalUnmarshalledMsg
                      value:
                        type: "simple"
                        expression: "${body}"
                    - method: loop
                      expression:
                        type: simple
                        expression: "${exchangeProperty.filterStringifedXmlFields.size()}"
                      copy: true
                      steps:
                        - method: setProperty
                          key: filterStringifiedXmlIndex
                          value:
                            type: "simple"
                            expression: "${header.Integration_HubLoopIndex}"
                        - method: setBody
                          expression:
                            type: groovy
                            expression: |
                              // Get the current body value
                              def bodyStr = exchange.getIn().getBody(String)

                              // Find the position of "<alert>" and extract the string after it
                              def alertIndex = bodyStr.indexOf("<alert>")
                              if (alertIndex != -1) {
                                  // Return the substring starting from the position after "<alert>"
                                  return bodyStr.substring(alertIndex)
                              }

                              // If no "<alert>" is found, return the body as is
                              return bodyStr
                        - method: unmarshal
                          type: xml
                        - method: setBody
                          expression:
                            type: groovy
                            expression: |
                              internalUnmarshalledMsg = exchange.properties.internalUnmarshalledMsg
                              field = exchange.properties.filterStringifedXmlFields.get(exchange.properties.filterStringifiedXmlIndex.toString())

                              internalUnmarshalledMsg.put(field.toString(), body)
                              return internalUnmarshalledMsg
            # REF- - Debug message
            - method: log
              level: "DEBUG"
              message: "splitting body using '${exchangeProperty.filterSplit}'"
            # REF-SLB - Split payload if array
            - method: split
              resolve-maps-as-key-value: false
              expressions:
                - type: groovy
                  expression: |
                    filterSplitExpression = exchange.properties.get("filterSplit")
                    language = exchange.getContext().resolveLanguage("simple")
                    expression = language.createExpression(filterSplitExpression)
                    return expression.evaluate(exchange);
              steps:
                # REF- - Store split message as "internalSplitMsg" header
                - method: setProperty
                  key: internalSplitMsg
                  value:
                    type: "simple"
                    expression: "${body}"
                # REF- - Set Body to contents of property "internalSplitMsg"
                - method: setBody
                  expression:
                    type: simple
                    expression: "${exchange.properties[internalSplitMsg]}"
                # REF- - Restore original headers
                - method: process
                  classname: com.interlinksoftware.integrationhub.config.step.processor.RestoreOriginHeadersProcessor
                # REF- - Cleanse headers
                - method: process
                  classname: com.interlinksoftware.integrationhub.config.step.processor.CleanseHeadersProcessor
                # REF- - Store exchangeId as CorrelationId
                - method: setHeader
                  key: correlationId
                  value:
                    type: simple
                    expression: "${exchangeId}"
                - method: log
                  level: "WARN"
                  message: "filterFormat='${exchangeProperty.filterFormat}', blankPlaceholder='$[[blankPlaceholder]]', newlinePlaceholder='$[[newlinePlaceholder]]', fieldLimit='$[[fieldLimit]]', messageLimit='$[[messageLimit]]'"
                - method: alertFormat
                  template: ${exchangeProperty.filterFormat}
                  blankPlaceholder: "$[[blankPlaceholder]]"
                  newlinePlaceholder: "$[[newlinePlaceholder]]"
                  fieldLimit: $[[fieldLimit]]
                  messageLimit: $[[messageLimit]]
                  includeHeaders: $[[includeHeaders]]
                # REF-OHH - Set property "internalProcessedMessage" to body
                - method: setProperty
                  key: internalProcessedMessage
                  value:
                    type: "simple"
                    expression: "${body}"
                # REF- - Debug message
                - method: log
                  level: "DEBUG"
                  message: "writing to processed file"
                # REF-4MH - Log message to file
                - method: isslog
                  message: "parentId=${exchange.properties[parentId]} | processed(${exchange.properties['filterExpression']}) | ${bodyAs(String)}"
                  type: processed
                  queueSize: $[[uiMessageLimit]]
                  writeToFile: $[[logProcessed]]
                  writeToDatabase: $[[logProcessed]]
                - method: choice
                  when:
                    - predicate:
                        type: groovy
                        expression: |
                          destinations = exchange.properties.getOrDefault("filterDestinations", null)
                          if (destinations == null || destinations.equals("NOT_SET")) {
                            exchange.properties.put("sendToGlobal", true);
                            return false;
                          } else {
                            tempDestinations = []

                            for (value in destinations.values()) {
                              exchange.properties.put("sendToGlobal", value.sendToGlobalDestination);
                              def expression = value.expression ?: "default"

                              if (expression != "default") {
                                language = exchange.getContext().resolveLanguage("simple")
                                simpleExpression = language.createPredicate(expression)

                                matches = simpleExpression.matches(exchange)

                                if (matches) {
                                  tempDestinations = value.destinationNames.values().toList()
                                  exchange.properties.put("filterDestinations", tempDestinations);
                                  return true;
                                }
                              } else {
                                tempDestinations.addAll(value.destinationNames.values().toList())
                              }
                            }

                            exchange.properties.put("filterDestinations", tempDestinations);
                            return true;
                          }
                      steps:
                        - method: setBody
                          expression:
                            type: simple
                            expression: ${exchange.properties[internalProcessedMessage]}
                        - method: destination
                          outputRefExpression: ${exchangeProperty.filterDestinations}
                - method: setBody
                  expression:
                    type: simple
                    expression: ${exchange.properties[internalProcessedMessage]}
                - method: choice
                  when:
                    - predicate:
                        type: groovy
                        expression: |
                          sendToGlobal = exchange.properties.getOrDefault("sendToGlobal", "true")
                          return sendToGlobal
                      steps:
                        - method: destination
                          outputRefExpression: ${exchangeProperty.placeholders[destinationServers]}