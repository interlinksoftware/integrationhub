                            <br/><br/>To access the values within the **raw** field, we need to first extract its contents into a structured map.<br/><br/>

                            To do this, we specify **raw** in the **Fields to Map** setting. This instructs the pipeline to parse the pipe-delimited key = value string into key-value pairs.<br/><br/>

                            Once parsed, these values can be accessed directly in the **format**, for example:<br/><br/>

