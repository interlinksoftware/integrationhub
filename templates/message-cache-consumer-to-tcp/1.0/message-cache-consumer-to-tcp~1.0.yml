shared:
  templates:
    "[message-cache-consumer-to-tcp~1.0]":
      version: "1.0"
      minimumCompatibilityVersion: 2.4.0
      description: "The message-cache-consumer-to-tcp template provides functionality to read from a message-cache topic, filter/transform and send to a TCP listener, via an integraton-hub pipeline."
      placeholders:
        "messageCacheBrokers":
          description: "Comma-separated list of Message Cache brokers in host:port format"
          type: string
          required: true
          bind-to-exchange: true
        "messageCacheUsername":
          description: "Specify the username to authenticate against the  Message Cache with"
          type: string
          required: true
          bind-to-exchange: true
        "messageCachePassword":
          description: "Specify the password to authenticate against the  Message Cache with"
          type: string
          valueType: encrypted
          required: true
          bind-to-exchange: true
        "topicName":
          description: "Specify the topic to consume from"
          type: string
          required: true
          bind-to-exchange: true
        "groupName":
          description: "Specify the consumer group name to use"
          type: string
          required: true
          bind-to-exchange: true
        "sslContextParameters":
          description: "Reference to the ssl configuration to enable SSL on the pipeline"
          type: string
          required: false
          bind-to-exchange: false
          defaultValue: "#IssSslConfig"
        "regexList":
          description: "List of regular expressions to execute against the body"
          bind-to-exchange: true
          required: false
          defaultValue: "NOT_SET"
        "includeHeaders":
          description: "This option is used to toggle between including/excluding headers in the processed message"
          type: boolean
          required: false
          bind-to-exchange: true
          defaultValue: false
        "embeddedXmlToEscape":
          description: "If the incoming message is in JSON format and contains embedded XML with unescaped characters (such as double quotes), specify the name of the root XML element"
          type: "string"
          required: false
          bind-to-exchange: true
          defaultValue: "NOT_SET"
        "throttleEnabled":
          description: "Toggle to enable / disable throttling of incoming messages"
          type: boolean
          required: false
          defaultValue: false
        "throttleCount":
          description: "Maximum number of incoming messages that can be ingested within the defined throttle period"
          type: string
          required: false
          defaultValue: 10
        "throttlePeriod":
          description: "The time period during which the throttle count is valid for"
          type: string
          required: false
          defaultValue: "10s"
        "destinationServers":
          description: "List of servers to send the pipeline output to"
          type: array
          required: true
          bind-to-exchange: true
        "preprocessHeaders":
          description: ""
          type: array
          required: false
          bind-to-exchange: true
          defaultValue: "NOT_SET"
        "allowList":
          description: "List of logic statements to determine if the request can proceed"
          type: array
          required: false
          bind-to-exchange: true
          defaultValue: "NOT_SET"
        "denyList":
          description: "List of logic statements to halt the request"
          type: array
          required: false
          bind-to-exchange: true
          defaultValue: "NOT_SET"
        "filters":
          description: "List of filters to match and format the data"
          type: array
          required: false
          bind-to-exchange: true
          defaultValue: "NOT_SET"
        "newlinePlaceholder":
          description: "String to replace newline characters values with"
          type: string
          required: false
          defaultValue: " "
        "blankPlaceholder":
          description: "String to replace blank values with"
          type: string
          required: false
          defaultValue: "N/A"
        "logProcessed":
          description: "To log the data once processed into its final form, set this to true. The received file is logs/<pipeline name>-<yyyymmdd>.processed"
          type: boolean
          required: false
          bind-to-exchange: true
          defaultValue: true
        "logSuccess":
          description: "To log messages that were successfully sent to the tcp destination, set this to true. The success file is logs/<pipeline name>-<yyyymmdd>.success"
          type: boolean
          required: false
          bind-to-exchange: true
          defaultValue: true
        "logReceived":
          description: "To log all received data, set this to true. The received file is logs/<pipeline name>-<yyyymmdd>.received"
          type: boolean
          required: false
          bind-to-exchange: true
          defaultValue: true
        "logDropped":
          description: "To log all dropped data, set this to true. The dropped file is logs/<pipeline name>-<yyyymmdd>.dropped"
          type: boolean
          required: false
          bind-to-exchange: true
          defaultValue: true
        "logFailed":
          description: "To log all failed data, set this to true. The failed file is logs/<pipeline name>-<yyyymmdd>.failed"
          type: boolean
          required: false
          bind-to-exchange: true
          defaultValue: true
        "uiMessageLimit":
          description: "Limit of failed/dropped/success/processed/received messages to display on the UI."
          type: integer
          required: false
          defaultValue: "200"
        "fieldLimit":
          description: "The maximum number of characters allowed in each field of the incoming message"
          type: integer
          required: false
          defaultValue: 256
        "messageLimit":
          description: "The maximum number of characters allowed in the message after it has been formatted"
          type: integer
          required: false
          defaultValue: 4096
      uiSchema:
        type: object
        properties:
          datasourceConfig:
            type: header
            title: Message Cache Datasource
          fileGroup:
            type: object
            ui:
              component: group
            properties:
              fileConfig:
                type: grid
                ui:
                  columns:
                    - 25%
                    - auto
                  alignRow: baseline
                properties:
                  fileConfigTitle:
                    type: grid
                    ui:
                      columns:
                        - auto
                        - 1fr
                      areas:
                        - description-text description-help
                      alignRow: center
                    properties:
                      description-text:
                        type: typography
                        defaultValue: Properties
                        ui:
                          indexed: true
                      description-help:
                        type: typography
                        help:
                          icon: info-circle
                          content: |-
                            ### Message Cache DataSource Properties

                              The following properties can be specified for the Message Cache DataSource.

                              | property | description |
                              | -- | -- |
                              | Message Cache Brokers | A comma-separated list of message-cache brokers in `host:port` format, for example `broker1:9092,broker2:9092` |
                              | Topic Name | This name of the topic you wish to subscribe to |
                              | Message Cache Username | The username for authentication |
                              | Message Cache Password | The password for authentication |
                              | Group Name | The Group ID to associated for consumer |

                            ### Optional Settings

                              | property | description |
                              | -- | -- |
                              | SSL Context Parameters | Reference to the ssl configuration to use when making the connection to the Message Cache |
                              | Embedded XML Root Element | If the incoming message is in JSON format and contains embedded XML with unescaped characters (such as double quotes), specify the name of the root XML element. This allows the processor to locate and escape characters within that XML block before further processing |
                  fileConfigValue:
                    type: object
                    properties:
                      mc1:
                        type: grid
                        ui:
                          areas:
                            - messageCacheBrokers messageCacheBrokers topicName
                          columns:
                            - 35%
                            - 35%
                            - auto
                        alignRow: baseline
                        properties:
                          messageCacheBrokers:
                            type: string
                            title: Message Cache Brokers
                            description: Comma-separated list in host:port format, for example broker1:9092,broker2:9092
                            validation:
                              message: Please specify at least one message-cache broker
                              required: true
                          topicName:
                            type: string
                            title: Topic Name
                            validation:
                              message: Please specify a valid topic
                              required: true
                      mc2:
                        type: grid
                        ui:
                          areas:
                            - messageCacheUsername messageCachePassword groupName groupName
                          columns:
                            - 35%
                            - 35%
                            - auto
                        alignRow: baseline
                        properties:
                          messageCacheUsername:
                            type: string
                            title: Message Cache Username
                            validation:
                              message: Please specify broker username
                              required: true
                          messageCachePassword:
                            type: password
                            title: Message Cache Password
                            validation:
                              message: Please specify broker password
                              required: true
                          groupName:
                            type: string
                            title: Group Name
                            validation:
                              message: Please specify group id
                              required: true
                      optionalSettings:
                        type: expansion-panel
                        title: Optional Settings
                        ui:
                          elevation: 2
                        properties:
                          optionalSettingsGrid:
                            type: grid
                            ui:
                              areas:
                                - regexList regexList regexList regexList
                                - sslContextParameters sslContextParameters embeddedXmlToEscape embeddedXmlToEscape
                              columns:
                                - auto
                              alignRow: baseline
                            properties:
                              regexList:
                                type: array
                                title: Regular Expression list (apply regex)
                                ui:
                                  indexed: true
                                  areas:
                                    - pattern replacement
                                help:
                                  icon: info-circle
                                  content: >-
                                    ### Apply Regular Expression parsing

                                    You can define a list of regular expressions to be applied against the incoming body. Each expression will be executed in the order listed below.

                                    ##### See examples below


                                        # escape unescaped backslashes
                                        example data: {"message": "This message contains an \unescaped\ backslashes"}
                                        pattern:      \\
                                        replacement:  \\\\

                                        # remove everything before <alert>
                                        example data: "IntegrationId ABC:111 | <alert><domain>someserver</domain></alert>"
                                        pattern:      ^.*?<alert>
                                        replacement:  <alert>

                                        # remove everything after ABC
                                        example data: "IntegrationId ABC:111 | <alert><domain>someserver</domain></alert>"
                                        pattern:      ABC.*
                                        replacement:  (empty string)

                                        # replace all occurrences of apple with orange
                                        example data: "I like apple pie."
                                        pattern:      (?i)apple
                                        replacement:  orange

                                        # remove trailing spaces
                                        example data: "The quick brown fox   "
                                        pattern:      \s+$
                                        replacement:  (empty string)
                                propertyTemplate:
                                  pattern:
                                    type: string
                                    title: Pattern
                                  replacement:
                                    type: string
                                    title: Replacement
                              sslContextParameters:
                                title: SSL Context Parameters
                                type: sslcontext
                              embeddedXmlToEscape:
                                title: Embedded XML Root Element
                                type: string
          destinationSection:
            type: object
            properties:
              destinationHeader:
                type: header
                title: Destination Configuration
              destinationContainer:
                type: object
                ui:
                  component: group
                properties:
                  commandConfig:
                    type: grid
                    ui:
                      columns:
                        - 25%
                        - auto
                      alignRow: center
                    properties:
                      destinationTitle:
                        type: grid
                        ui:
                          columns:
                            - auto
                            - 1fr
                          areas:
                            - description-text description-help
                          alignRow: center
                        properties:
                          description-text:
                            type: typography
                            defaultValue: Destination Properties
                            ui:
                              indexed: true
                          description-help:
                            type: typography
                            ui:
                              icon: info-circle
                            help:
                              icon: info-circle
                              content: |-
                                ### Destination Properties

                                  The following properties can be specified for the destination.

                                  | property | description |
                                  | -- | -- |
                                  | Destination | Defines the output targets for this pipeline, specifying where the output will be directed |
                      destinationValue:
                        type: object
                        properties:
                          destinationGrid:
                            type: grid
                            ui:
                              columns:
                                - auto
                              alignRow: baseline
                            properties:
                              destinationServers:
                                type: outputtarget
                                title: Destination
          optionalSettings:
            type: expansion-panel
            title: Optional Settings
            ui:
              elevation: 2
            properties:
              characterLimitGrid:
                type: grid
                ui:
                  columns:
                    - auto
                    - auto
                properties:
                  fieldLimit:
                    type: number
                    title: Field Limit
                    defaultValue: 256
                    help:
                      icon: info-circle
                      content: |-
                        The maximum number of characters allowed in each field of the incoming message
                  messageLimit:
                    type: number
                    title: Message Limit
                    defaultValue: 4096
                    help:
                      icon: info-circle
                      content: |-
                        The maximum number of characters allowed in the message after it has been formatted
              togglePreprocessHeaders:
                type: switch
                title: Configure Pre-process Headers
                defaultValue: false
              conditional-section-preprocessHeaders:
                type: conditional
                expression:
                  left: $togglePreprocessHeaders
                  operator: '=='
                  right: true
                properties:
                  preprocessHeaders:
                    type: array
                    title: Pre-processing Headers Override
                    ui:
                      columns:
                        - auto
                        - auto
                    propertyTemplate:
                      expression:
                        type: text
                        title: The expression to match
                        help:
                          icon: info-circle
                          content: >-
                            ### Simple Expressions


                            > **field** _operator_ **value**


                            ##### field: the field that referenced from the incoming message. To match against the whole string use **\${bodyAs(String)}** , to reference a specific field use **\${body.hostname}**

                            ##### value: the value being tested against

                            ##### operators


                                ==          equals
                                =~          equals (case insensitive)
                                !=          does not equal
                                !=~         does not equal (case insensitive)
                                contains    contains string
                                !contains   does not contain
                                regex       matches regex expression
                                !regex      does not match regex expression
                                &&          AND multiple expressions
                                ||          OR multiple expressions

                            ##### See examples below


                                # match any string
                                ${bodyAs(String)} regex '(?s)(.*?)'
                                # incoming message contains 'this' but not 'that'
                                ${bodyAs(String)} =~ 'this' && ${bodyAs(String)} !=~ 'that'
                                # incoming message contains 'dog' or 'cat'
                                ${bodyAs(String)} =~ 'dog' || ${bodyAs(String)} !=~ 'cat'
                                # incoming message field 'username' equals 'ppadmin'
                                ${body.username} == 'ppadmin'
                                # incoming message field 'username' is not null
                                ${body.username} != null
                                # incoming message field 'origindate' equals todays date
                                ${body.origindate} == ${date:now:yyyyMMdd}
                      headers:
                        type: map
                        title: Headers
                        ui:
                          keyPlaceholder: Header Name
                        valueSchema:
                          type: text
                          ui:
                            placeholder: Header Value
              toggleAllowDenyList:
                type: switch
                title: Configure Allow/Deny List
                defaultValue: false
              conditional-section-allow-deny:
                type: conditional
                expression:
                  left: $toggleAllowDenyList
                  operator: "=="
                  right: true
                properties:
                  allowList:
                    type: array
                    title: Allow list (process if expression is matched)
                    ui:
                      indexed: true
                    help:
                      icon: info-circle
                      content: >-
                        ### Simple Expressions


                        > **field** _operator_ **value**


                        ##### field: the field that referenced from the incoming message. To match against the whole string use **\${bodyAs(String)}** , to reference a specific field use **\${body.hostname}**

                        ##### value: the value being tested against

                        ##### operators


                            ==          equals
                            =~          equals (case insensitive)
                            !=          does not equal
                            !=~         does not equal (case insensitive)
                            contains    contains string
                            !contains   does not contain
                            regex       matches regex expression
                            !regex      does not match regex expression
                            &&          AND multiple expressions
                            ||          OR multiple expressions

                        ##### See examples below


                            # match any string
                            ${bodyAs(String)} regex '(?s)(.*?)'
                            # incoming message contains 'this' but not 'that'
                            ${bodyAs(String)} =~ 'this' && ${bodyAs(String)} !=~ 'that'
                            # incoming message contains 'dog' or 'cat'
                            ${bodyAs(String)} =~ 'dog' || ${bodyAs(String)} !=~ 'cat'
                            # incoming message field 'username' equals 'ppadmin'
                            ${body.username} == 'ppadmin'
                            # incoming message field 'username' is not null
                            ${body.username} != null
                            # incoming message field 'origindate' equals todays date
                            ${body.origindate} == ${date:now:yyyyMMdd}
                  denyList:
                    type: array
                    title: Deny list (drop if expression is matched)
                    ui:
                      indexed: true
                    help:
                      icon: info-circle
                      content: >-
                        ### Simple Expressions


                        > **field** _operator_ **value**


                        ##### field: the field that referenced from the incoming message. To match against the whole string use **\${bodyAs(String)}** , to reference a specific field use **\${body.hostname}**

                        ##### value: the value being tested against

                        ##### operators


                            ==          equals
                            =~          equals (case insensitive)
                            !=          does not equal
                            !=~         does not equal (case insensitive)
                            contains    contains string
                            !contains   does not contain
                            regex       matches regex expression
                            !regex      does not match regex expression
                            &&          AND multiple expressions
                            ||          OR multiple expressions

                        ##### See examples below


                            # match any string
                            ${bodyAs(String)} regex '(?s)(.*?)'
                            # incoming message contains 'this' but not 'that'
                            ${bodyAs(String)} =~ 'this' && ${bodyAs(String)} !=~ 'that'
                            # incoming message contains 'dog' or 'cat'
                            ${bodyAs(String)} =~ 'dog' || ${bodyAs(String)} !=~ 'cat'
                            # incoming message field 'username' equals 'ppadmin'
                            ${body.username} == 'ppadmin'
                            # incoming message field 'username' is not null
                            ${body.username} != null
                            # incoming message field 'origindate' equals todays date
                            ${body.origindate} == ${date:now:yyyyMMdd}
              toggleFilter:
                type: switch
                title: Configure Filters
                defaultValue: false
              conditional-section-filters:
                type: conditional
                expression:
                  left: $toggleFilter
                  operator: '=='
                  right: true
                properties:
                  placeholders:
                    type: grid
                    ui:
                      columns:
                        - auto
                        - auto
                        - auto
                    properties:
                      newlinePlaceholder:
                        type: string
                        title: Newline Placeholder
                        description: >-
                          Replace newline characters with this value, defaults to a single space
                      blankPlaceholder:
                        type: string
                        title: Blank Placeholder
                        description: Replace blank keys with this value, defaults to a 'N/A'
                      includeHeaders:
                        type: switch
                        title: Include Headers in Processed Message
                  filters:
                    type: array
                    title: filter and format messages
                    ui:
                      columns:
                        - auto
                      areas:
                        - expression split format format
                        - stringifiedJsonFields stringifiedXmlFields fieldToMap fieldToMap
                        - destinations destinations destinations destinations
                    propertyTemplate:
                      expression:
                        type: string
                        title: Expression
                        help:
                          icon: info-circle
                          content: >-
                            ### Simple Expressions


                            > **field** _operator_ **value**


                            ##### field: the field that referenced from the incoming message. To match against the whole string use **\${bodyAs(String)}** , to reference a specific field use **\${body.hostname}**

                            ##### value: the value being tested against

                            ##### operators


                                ==          equals
                                =~          equals (case insensitive)
                                !=          does not equal
                                !=~         does not equal (case insensitive)
                                contains    contains string
                                !contains   does not contain
                                regex       matches regex expression
                                !regex      does not match regex expression
                                &&          AND multiple expressions
                                ||          OR multiple expressions

                            ##### See examples below


                                # match any string
                                ${bodyAs(String)} regex '(?s)(.*?)'
                                # incoming message contains 'this' but not 'that'
                                ${bodyAs(String)} =~ 'this' && ${bodyAs(String)} !=~ 'that'
                                # incoming message contains 'dog' or 'cat'
                                ${bodyAs(String)} =~ 'dog' || ${bodyAs(String)} !=~ 'cat'
                                # incoming message field 'username' equals 'ppadmin'
                                ${body.username} == 'ppadmin'
                                # incoming message field 'username' is not null
                                ${body.username} != null
                                # incoming message field 'origindate' equals todays date
                                ${body.origindate} == ${date:now:yyyyMMdd}
                      format:
                        type: string
                        title: Format
                        help:
                          icon: info-circle
                          content: >-
                            # Transform Format

                            The format output redefines how you wish to transform the message.


                            ## JSON Object example

                            incoming message


                                {
                                  "user": {
                                    "name": "ppadmin",
                                    "uid": 229,
                                    "group": "ppusers"
                                  },
                                  "origindate": "2022-12-15 12:01:34"
                                }

                            ### auto mapping

                            Auto transform format


                                UserAlert ${auto}

                            Transformed output


                                UserAlert datetime = 2022-12-15 12:01:34 | name = ppadmin | group = ppusers | Accept = text/plain, application/xml, text/xml, application/json, application/*+xml, application/*+json, */* |  Accept-Encoding = gzip,deflate |  Connection = keep-alive |  Content-Length = 114 |  Content-Type = application/json |  correlationId = 43CA053BE23B183-0000000000000002 |  Host = localhost:30052 |  HttpCharacterEncoding = UTF-8 |  HttpMethod = POST |  HttpPath = N/A |  HttpQuery = null |  HttpUri = / |  HttpUrl = [http://localhost:30052/](http://localhost:30052/) |  parentId = 43CA053BE23B183-0000000000000001 |  ServletContextPath = / |  User-Agent = Apache-HttpClient/4.5.13 (Java/1.8.0_241) |

                            ### pre-defined mapping


                            Pre-defined transform format

                                UserAlert datetime = ${body.origindate} | name = ${body.user.name} | group = ${body.user.group} |

                            Transformed output


                                UserAlert datetime = 2022-12-15 12:01:34 | name = ppadmin | group = ppusers |

                            ## JSON Array example

                            incoming message


                                {
                                  "testfield": "VALUE1",
                                  "testfield2": "VALUE2",
                                  "nested": {
                                    "nestedField": "hello",
                                  },
                                  "array": [
                                    "array1",
                                    "array2",
                                    "array3"
                                  ]
                                }

                            ### auto mapping

                            Auto transform format


                                UserAlert \${auto}

                            Transformed output


                                UserAlert array.0 = array1 |  array.1 = array2 |  array.2 = array3 |  testfield2 = VALUE2 |   nested.nestedField = hello |  testfield = VALUE1 |   Accept = text/plain, application/xml, text/xml, application/json, application/*+xml, application/*+json, */* |  Accept-Encoding = gzip,deflate |  Connection = keep-alive |  Content-Length = 114 |  Content-Type = application/json |  correlationId = 43CA053BE23B183-0000000000000002 |  Host = localhost:30052 |  HttpCharacterEncoding = UTF-8 |  HttpMethod = POST |  HttpPath = N/A |  HttpQuery = null |  HttpUri = / |  HttpUrl = [http://localhost:30052/](http://localhost:30052/) |  parentId = 43CA053BE23B183-0000000000000001 |  ServletContextPath = / |  User-Agent = Apache-HttpClient/4.5.13 (Java/1.8.0_241) |

                            ### pre-defined mapping


                            Pre-defined transform format


                                UserAlert firstOne = ${body.array[0]} | msg = ${body.nested.nestedField} |
                            Transformed output


                                UserAlert firstOne = array1 | msg = hello |
                      split:
                        type: string
                        title: Split
                        defaultValue: ${body}
                        help:
                          icon: info-circle
                          content: >-
                            # Split messages

                            The split expression allows you to split an payload containing an array in to multiple events, by default it will split the main body of the message


                            ## JSON Array example

                            By default it will split the payload if it is an array.

                            For example:


                                [
                                  {
                                    "user": {
                                      "name": "ppadmin",
                                      "uid": 229,
                                      "group": "ppusers"
                                    },
                                    "origindate": "2022-12-15 12:01:34"
                                  },
                                  {
                                    "user": {
                                      "name": "Jeff",
                                      "uid": 456,
                                      "group": "ppusers"
                                    },
                                    "origindate": "2022-12-15 15:56:27"
                                  }
                                ]

                            Will result in two messages being sent to the destination.


                            ### Specifying the split expression

                            If you wish to split over a nested array, you can define the path to the "array".

                            With an incoming message of:


                                {
                                  "data": [
                                    {
                                      "user": {
                                        "name": "ppadmin",
                                        "uid": 229,
                                        "group": "ppusers"
                                      },
                                      "origindate": "2022-12-15 12:01:34"
                                    },
                                    {
                                      "user": {
                                        "name": "Jeff",
                                        "uid": 456,
                                        "group": "ppusers"
                                      },
                                      "origindate": "2022-12-15 15:56:27"
                                    }
                                  ]
                                }

                            The split expression will be:

                                ${body.data}
                      stringifiedJsonFields:
                        type: array
                        title: JSON Fields
                        help:
                          icon: info-circle
                          content: >-
                            ### JSON Unpacking


                            ##### A list of fields to unpack that contain stringified JSON values
                      stringifiedXmlFields:
                        type: array
                        title: XML Fields
                        help:
                          icon: info-circle
                          content: >-
                            ### XML Unpacking


                            ##### A list of fields to unpack that contain stringified XML values
                      fieldToMap:
                        type: array
                        title: Field to Map
                        help:
                          icon: info-circle
                          content: >-
                            ### Field to Map

                            A list of fields in the body that contain delimited key-value string data<br/><br/>**(e.g., key = value | key2 = value2)**<br/><br/>Each field will be parsed into a map for easier access to individual values when configuring a custom alert format.<br/><br/>For example, take the following body:<br/><br/>

                            ```

                              {
                                "currentTime": "2025-07-17T14:16:02+0100",
