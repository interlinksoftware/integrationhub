shared:
  templates:
    "[webhook-to-alertserver~1.1]":
      version: 1.1
      minimumCompatibilityVersion: 3.2.0
      description: "The webhook-to-alertserver template provides functionality to transfer, filter/transform and send from webhook listener to alertserver, via an integration-hub pipeline."
      placeholders:
        "protocol":
          description: "The http protocol for the webhook listener"
          required: false
          type: "string"
          defaultValue: "https"

        "hostname":
          description: "Host to bound the listner to"
          required: false
          type: "string"
          defaultValue: "0.0.0.0"

        "path":
          description: "The path to listen on for requests"
          required: false
          type: "string"
          defaultValue: ""

        "port":
          description: "Target port number allocated for third party applications"
          required: false
          type: "integer"
          defaultValue: "6780"

        "sslContextParameters":
          description: "Reference to the ssl configuration to enable SSL on the pipeline"
          required: false
          defaultValue: "#IssSslConfig"
          type: "string"

        "apiKey":
          description: "Only requests with this present will be able to process data"
          bind-to-exchange: true
          required: false
          defaultValue: ""
          valueType: "encrypted"

        "authEnabled":
          description: "Toggle basic authentication"
          required: false
          defaultValue: "false"
          type: "boolean"

        "users":
          description: "Map of usernames and passwords"
          required: false
          type: "map"
          defaultValue: ""

        "throttleEnabled":
          description: "Toggle to enable / disable throttling of incoming messages"
          bind-to-exchange: true
          required: false
          type: "boolean"
          defaultValue: true

        "throttleCount":
          description: "Maximum number of incoming messages that can be ingested within the defined throttle period"
          required: false
          type: "string"
          defaultValue: 10

        "throttlePeriod":
          description: "The time period during which the throttle count is valid for"
          required: false
          type: "string"
          defaultValue: "10s"

        "preprocessFilters":
          description: "Array of expressions, where if matched, prevents further processing"
          required: false
          defaultValue: "NOT_SET"
          bind-to-exchange: true
          type: "array"

        "alertLookupDatasource":
          description: "The name of the datasource that will be used to lookup alerts"
          required: true
          type: "string"

        "alertServerHost":
          description: "The hostname for the AlertServer connection"
          type: "string"
          required: false
          defaultValue: "127.0.0.1"

        "eventDaemonHost":
          description: "The hostname for the EventDaemon connection - as required for AlertLookup"
          type: "string"
          required: false
          defaultValue: "127.0.0.1"

        "eventDaemonPort":
          description: "The port for the EventDaemon connection - as required for AlertLookup"
          type: "string"
          required: false
          defaultValue: "35000"

        "alertServerPort":
          description: "The port for the AlertServer connection"
          type: "string"
          required: false
          defaultValue: "30000"

        "preprocessHeaders":
          description: ""
          required: false
          defaultValue: "NOT_SET"
          bind-to-exchange: true
          type: "array"

        "allowList":
          bind-to-exchange: true
          description: "List of logic statements to determine if the request can proceed"
          required: false
          defaultValue: "NOT_SET"
          type: "array"

        "denyList":
          bind-to-exchange: true
          description: "List of logic statements to halt the request"
          required: false
          defaultValue: "NOT_SET"
          type: "array"

        "filters":
          bind-to-exchange: true
          description: "List of filters to match and format the data"
          required: false
          defaultValue: "NOT_SET"
          type: "array"

        "newlinePlaceholder":
          description: "String to replace newline characters values with"
          required: false
          defaultValue: " "
          type: "string"

        "blankPlaceholder":
          description: "String to replace blank values with"
          required: false
          defaultValue: "N/A"
          type: "string"

        "logProcessed":
          description: "To log the data once processed into its final form, set this to true. The received file is logs/<pipeline name>-<yyyymmdd>.processed"
          bind-to-exchange: true
          required: false
          type: "boolean"
          defaultValue: true

        "logProcessedToDatahub":
          description: "Send processed log messages to Datahub"
          bind-to-exchange: true
          required: false
          type: boolean
          defaultValue: false

        "logSuccess":
          description: "To log messages that were successfully sent to the tcp destination, set this to true. The success file is logs/<pipeline name>-<yyyymmdd>.success"
          bind-to-exchange: true
          required: false
          type: "boolean"
          defaultValue: true

        "logSuccessToDatahub":
          description: "Send successful log messages to Datahub"
          bind-to-exchange: true
          required: false
          type: boolean
          defaultValue: false

        "logReceived":
          description: "To log all received data, set this to true. The received file is logs/<pipeline name>-<yyyymmdd>.received"
          bind-to-exchange: true
          required: false
          type: "boolean"
          defaultValue: true

        "logReceivedToDatahub":
          description: "Send received log messages to Datahub"
          bind-to-exchange: true
          required: false
          type: boolean
          defaultValue: false

        "logDropped":
          description: "To log all dropped data, set this to true. The dropped file is logs/<pipeline name>-<yyyymmdd>.dropped"
          bind-to-exchange: true
          required: false
          type: "boolean"
          defaultValue: true

        "logDroppedToDatahub":
          description: "Send dropped log messages to Datahub"
          bind-to-exchange: true
          required: false
          type: boolean
          defaultValue: false

        "logFailed":
          description: "To log all failed data, set this to true. The failed file is logs/<pipeline name>-<yyyymmdd>.failed"
          bind-to-exchange: true
          required: false
          type: "boolean"
          defaultValue: true

        "logFailedToDatahub":
          description: "Send failed log messages to Datahub"
          bind-to-exchange: true
          required: false
          type: boolean
          defaultValue: false

        "logDatahubDataSource":
          description: "The DataSource to use when sending log messages to Datahub"
          bind-to-exchange: true
          required: false
          type: string
          defaultValue: ""

        "logMessageFields":
          description: "Log every field of the decoded message with the expression to reference it - for building filter and action expressions. The log file is logs/<pipeline name>.log"
          bind-to-exchange: true
          required: false
          type: "boolean"
          defaultValue: false

        "uiMessageLimit":
          description: "Limit of failed/dropped/success/processed/received messages to display on the UI."
          required: false
          defaultValue: "200"
          type: "integer"

      uiSchema:
        type: object
        properties:
          listenerHeader:
            type: header
            title: Webhook Listener
          listenerGroup:
            type: object
            ui:
              component: group
            properties:
              listenerConfig:
                type: grid
                ui:
                  columns:
                    - 25%
                    - auto
                  alignRow: baseline
                properties:
                  listenerConfigTitle:
                    type: grid
                    ui:
                      columns:
                        - auto
                        - 1fr
                      areas:
                        - description-text description-help
                      alignRow: center
                    properties:
                      description-text:
                        type: typography
                        defaultValue: Listener Properties
                        ui:
                          indexed: true
                      description-help:
                        type: typography
                        help:
                          icon: info-circle
                          content: |-
                            ### Webhook Listener Properties

                              The following properties can be specified for the Webhook Listener.

                              | property | description |
                              | -- | -- |
                              | Protocol | The http protocol for the webhook listener |
                              | Hostname / IP | Hostname / IP address to bind the listener to |
                              | Port | The port number to bind to the listener |

                              ### Optional Settings

                              | property | description |
                              | -- | -- |
                              | Path | The path to listen on for requests |
                              | sslContextParameters | Reference to the ssl configuration to enable SSL on the pipeline |
                              | API Key | When set, only requests with a matching **apiKey** header will be processed. Other requests receive a 401 response |

                              #### Basic Auth

                              | property | description |
                              | -- | -- |
                              | Enable Basic Auth | Toggle basic authentication |
                              | Users | Map of usernames and passwords |

                              #### Throttling

                              Throttling is enabled by default. Requests over the limit are rejected with an error response.

                              | property | description |
                              | -- | -- |
                              | Enable Throttling | Toggle throttling of incoming requests |
                              | Throttle Count | Maximum number of incoming messages that can be ingested within the defined throttle period |
                              | Throttle Period | The time period during which the throttle count is valid for, e.g. 10s or 1m |

                              ### Response

                              The caller receives a JSON response summarising the result of each action:

                                  {
                                    "status": "successful",
                                    "returnCode": "0",
                                    "http": { "code": "200", "method": "POST" },
                                    "data": { "action": "COMPLETED", "alertId": "...", "responses": [ ... ] }
                                  }

                              **status** is unsuccessful, **returnCode** 2 and the HTTP code 500 if any action returns a status of 400 or above.

                  listenerConfigValue:
                    type: object
                    properties:
                      listenerConnection:
                        type: grid
                        ui:
                          areas:
                            - protocol hostname hostname port
                          columns:
                            - 15%
                            - 65%
                            - auto
                          alignRow: baseline
                        properties:
                          protocol:
                            type: select
                            title: Protocol
                            defaultValue: HTTPS
                            ui:
                              options:
                                - HTTP
                                - HTTPS
                          hostname:
                            type: string
                            title: Hostname / IP
                            defaultValue: "0.0.0.0"
                          port:
                            type: number
                            title: Port
                            defaultValue: 6780
                      optionalSettings:
                        type: expansion-panel
                        title: Optional Settings
                        ui:
                          elevation: 2
                        properties:
                          proxyGrid:
                            type: object
                            properties:
                              noneToggleSettings:
                                type: grid
                                ui:
                                  areas:
                                    - . . . .
                                    - sslContextParameters sslContextParameters sslContextParameters sslContextParameters
                                    - path path apiKey apiKey
                                properties:
                                  sslContextParameters:
                                    type: sslcontext
                                    title: sslContextParameters
                                    defaultValue: "#IssSslConfig"
                                  path:
                                    type: string
                                    title: Path
                                  apiKey:
                                    type: password
                                    title: API Key
                              authEnabled:
                                type: switch
                                title: Enable Basic Auth
                                defaultValue: false
                              conditional-section-authenabled:
                                type: conditional
                                expression:
                                  left: $authEnabled
                                  operator: "=="
                                  right: true
                                properties:
                                  users:
                                    type: map
                                    title: Users
                                    ui:
                                      keyPlaceholder: Username
                                    valueSchema:
                                      type: password
                                      ui:
                                        placeholder: Password
                              throttleEnabled:
                                type: switch
                                title: Enable Throttling
                                defaultValue: true
                              conditional-section-throttling:
                                type: conditional
                                expression:
                                  left: $throttleEnabled
                                  operator: "=="
                                  right: true
                                properties:
                                  throttleGrid:
                                    type: grid
                                    ui:
                                      columns:
                                        - auto
                                        - auto
                                    properties:
                                      throttleCount:
                                        type: number
                                        title: Throttle Count
                                        defaultValue: 10
                                      throttlePeriod:
                                        title: Throttle Period
                                        type: string
                                        defaultValue: 10s
          alertLookupSection:
            type: object
            properties:
              alertLookupHeader:
                type: header
                title: Alert Lookup
              alertLookupContainer:
                type: object
                ui:
                  component: group
                properties:
                  commandConfig:
                    type: grid
                    ui:
                      columns:
                        - 25%
                        - auto
                      alignRow: baseline
                    properties:
                      alertLookupTitle:
                        type: grid
                        ui:
                          columns:
                            - auto
                            - 1fr
                          areas:
                            - description-text description-help
                          alignRow: center
                        properties:
                          description-text:
                            type: typography
                            defaultValue: Alert Lookup Properties
                            ui:
                              indexed: true
                          description-help:
                            type: typography
                            ui:
                              icon: info-circle
                            help:
                              icon: info-circle
                              content: |-
                                ### Alert Lookup Properties

                                  When looking up an alert, this pipeline will first attempt to find the alert in the **EventDaemon**. If no alert is found, the **Alert Lookup Datasource** will be used.

                                  The following properties can be specified for Alert Lookup.

                                  | property | description |
                                  | -- | -- |
                                  | Alert Lookup Datasource | The name of the datasource that will be used to lookup alerts<br></br>_This datasource should be configured to use the `besdb` database_ |
                                  | EventDaemon Hostname / IP Address | The hostname / IP address of the system that is running Event Daemon |
                                  | EventDaemon Port | The port that the EventDaemon is listening on |
                      alertLookupValue:
                        type: object
                        properties:
                          destinationGrid:
                            type: grid
                            ui:
                              columns:
                                - 30%
                                - 35%
                                - auto
                              alignRow: baseline
                            properties:
                              alertLookupDatasource:
                                type: datasource
                                title: Alert Lookup Datasource
                                ui:
                                  dataSourceType: jdbc
                                validation:
                                  required: true
                                  message: Please select the datasource for the besdb database
                              eventDaemonHost:
                                type: string
                                title: EventDaemon Hostname / IP Address
                                defaultValue: "127.0.0.1"
                              eventDaemonPort:
                                type: string
                                title: "EventDaemon Port"
                                defaultValue: "35000"
          filterSection:
            type: object
            properties:
              filterHeader:
                type: header
                title: Filter Configuration
              filterContainer:
                type: object
                ui:
                  component: group
                properties:
                  commandConfig:
                    type: grid
                    ui:
                      columns:
                        - 25%
                        - auto
                      alignRow: baseline
                    properties:
                      filterTitle:
                        type: grid
                        ui:
                          columns:
                            - auto
                            - 1fr
                          areas:
                            - description-text description-help
                          alignRow: center
                        properties:
                          description-text:
                            type: typography
                            defaultValue: Filter Properties
                            ui:
                              indexed: true
                          description-help:
                            type: typography
                            ui:
                              icon: info-circle
                            help:
                              icon: info-circle
                              content: |-
                                ## Filter Properties

                                  Filters are checked in order and the first filter whose expression matches is used. The matching filter's alert is looked up and its actions are run against it. Actions are only run against open alerts.

                                  | property | description |
                                  | -- | -- |
                                  | Expression | The expression which determines whether this filter handles the incoming message |
                                  | AlertId | An expression that resolves to the BES alert id from the incoming message, e.g. **\${body[alertId]}** |
                                  | Process Last Alert Only | When enabled and the AlertId expression resolves to a list, only the last alert id is processed<br></br><blockquote><i>This feature is useful in cases where multiple objects share identical alert ids</i></blockquote> |

                                  ### Actions

                                  Each filter can run one or more actions. Every action field accepts an expression, so values can be taken from the incoming message (e.g. **\${body[user]}**) or from the looked up alert (e.g. **\${exchangeProperty.loadedAlert[severity]}**).

                                  | action type | fields | description |
                                  | -- | -- | -- |
                                  | assignAlert | Operator | Assigns the alert to the BES operator. If the alert is assigned to another operator it is deassigned first |
                                  | closeAlert | Operator, Close Type (optional) | Closes the alert on behalf of the BES operator. Close Type defaults to 2 = operator, 3 = supervisor/remote, 4 = alert, 5 = timeout, 20 = inactive, 21 = correlation |
                                  | updateField | Field Name, Field Value | Sets a field on the alert to the given value |
                                  | addNote | Note | Adds a note to the alert |
                                  | updateDB | SQL Statement | Runs the SQL statement against the Alert Lookup Datasource. Fails if no rows are updated |
                                  | runCommand | Command, Arguments, Timeout (ms) | Runs a command on the Integration Hub server from the Integration Hub config directory |

                                  ### Example

                                  Assign the alert to the requesting user and add a note when **actionCode** is ASSIGN:

                                      Expression:  ${body[actionCode]} == 'ASSIGN'
                                      AlertId:     ${body[alertId]}
                                      Action 1:    assignAlert   Operator: ${body[user]}
                                      Action 2:    addNote       Note: Assigned to ${body[user]} by request ${body[requestId]}

                      filterValue:
                        type: object
                        properties:
                          filterGrid:
                            type: grid
                            ui:
                              columns:
                                - auto
                            properties:
                              filters:
                                type: array
                                title: filter and format messages
                                ui:
                                  columns:
                                    - auto
                                  areas:
                                    - expression expression alertId processLastAlertOnly
                                    - actions actions actions actions
                                    - . . . .
                                  addLabel: Filter Expression
                                propertyTemplate:
                                  expression:
                                    type: string
                                    title: Expression
                                    validation:
                                      required: true
                                      message: Please enter an expression to match
                                    help:
                                      icon: info-circle
                                      content: >-
                                        ### Simple Expressions


                                        > **field** _operator_ **value**


                                        ##### field: the field that referenced from the incoming
                                        message. To match against the whole string use
                                        **\${bodyAs(String)}** , to reference a specific field use
                                        **\${body[hostname]}**

                                        ##### value: the value being tested against

                                        ##### operators

                                            ==          equals
                                            =~          equals (case insensitive)
                                            !=          does not equal
                                            !=~         does not equal (case insensitive)
                                            contains    contains string
                                            !contains   does not contain
                                            regex       matches regex expression
                                            !regex      does not match regex expression
                                            &&          AND multiple expressions
                                            ||          OR multiple expressions

                                        ##### See examples below

                                            # match any string
                                            ${bodyAs(String)} regex '(?s)(.*?)'
                                            # incoming message contains 'this' but not 'that'
                                            ${bodyAs(String)} =~ 'this' && ${bodyAs(String)} !=~ 'that'
                                            # incoming message contains 'dog' or 'cat'
                                            ${bodyAs(String)} =~ 'dog' || ${bodyAs(String)} !=~ 'cat'
                                            # incoming message field 'username' equals 'ppadmin'
                                            ${body[username]} == 'ppadmin'
                                            # incoming message field 'username' is not null
                                            ${body[username]} != null
                                            # incoming message field 'origindate' equals todays date
                                            ${body[origindate]} == ${date:now:yyyyMMdd}
                                  alertId:
                                    type: string
                                    title: AlertId
                                    description: "Expression for the BES alert id, e.g. ${body[alertId]}"
                                    validation:
                                      required: true
                                      message: Please enter an expression for the BES alert id
                                  processLastAlertOnly:
                                    type: checkbox
                                    title: Process Last Alert Only
                                    defaultValue: true
                                  actions:
                                    type: array
                                    title: Actions
                                    ui:
                                      columns:
                                        - auto
                                      areas:
                                        - actionType actionType actionType actionType
                                        - conditional-section-closeAlert conditional-section-closeAlert conditional-section-closeAlert conditional-section-closeAlert
                                        - conditional-section-assignAlert conditional-section-assignAlert conditional-section-assignAlert conditional-section-assignAlert
                                        - conditional-section-updateField conditional-section-updateField conditional-section-updateField conditional-section-updateField
                                        - conditional-section-addNote conditional-section-addNote conditional-section-addNote conditional-section-addNote
                                        - conditional-section-updateDB conditional-section-updateDB conditional-section-updateDB conditional-section-updateDB
                                        - conditional-section-runCommand conditional-section-runCommand conditional-section-runCommand conditional-section-runCommand
                                      addLabel: Action
                                    propertyTemplate:
                                      actionType:
                                        type: select
                                        title: Action Type
                                        defaultValue: updateField
                                        ui:
                                          options:
                                            - assignAlert
                                            - closeAlert
                                            - updateField
                                            - addNote
                                            - updateDB
                                            - runCommand
                                      conditional-section-assignAlert:
                                        type: conditional
                                        expression:
                                          left: $actionType
                                          operator: "=="
                                          right: "assignAlert"
                                        properties:
                                          updateFieldGrid:
                                            type: grid
                                            ui:
                                              columns:
                                                - auto
                                            properties:
                                              operator:
                                                type: string
                                                title: Operator
                                                description: "BES operator to assign the alert to, e.g. ppadmin or ${body[user]}"
                                      conditional-section-closeAlert:
                                        type: conditional
                                        expression:
                                          left: $actionType
                                          operator: "=="
                                          right: "closeAlert"
                                        properties:
                                          updateFieldGrid:
                                            type: grid
                                            ui:
                                              columns:
                                                - auto
                                                - auto
                                            properties:
                                              operator:
                                                type: string
                                                title: Operator
                                                description: "BES operator closing the alert, e.g. ppadmin or ${body[user]}"
                                              closeType:
                                                type: string
                                                title: Close Type (optional)
                                                defaultValue: "2"
                                                description: "Leave as 2 (operator) unless needed. 3 = supervisor/remote, 4 = alert, 5 = timeout, 20 = inactive, 21 = correlation"
                                      conditional-section-updateField:
                                        type: conditional
                                        expression:
                                          left: $actionType
                                          operator: "=="
                                          right: "updateField"
                                        properties:
                                          updateFieldGrid:
                                            type: grid
                                            ui:
                                              columns:
                                                - auto
                                                - auto
                                            properties:
                                              fieldName:
                                                type: string
                                                title: Field Name
                                                description: "Alert field to update, e.g. incidentId"
                                              fieldValue:
                                                type: string
                                                title: Field Value
                                                description: "New value, e.g. ${body[ticketNumber]}"
                                      conditional-section-addNote:
                                        type: conditional
                                        expression:
                                          left: $actionType
                                          operator: "=="
                                          right: "addNote"
                                        properties:
                                          addNoteGrid:
                                            type: grid
                                            ui:
                                              columns:
                                                - auto
                                            properties:
                                              note:
                                                type: string
                                                title: Note
                                                description: "Note text, e.g. Ticket ${body[ticketNumber]} raised"
                                      conditional-section-updateDB:
                                        type: conditional
                                        expression:
                                          left: $actionType
                                          operator: "=="
                                          right: "updateDB"
                                        properties:
                                          updateDBGrid:
                                            type: grid
                                            ui:
                                              columns:
                                                - auto
                                            properties:
                                              statement:
                                                type: string
                                                title: SQL Statement
                                                description: "Runs against the Alert Lookup Datasource, e.g. UPDATE mytable SET status = 'done' WHERE alertid = '${exchangeProperty.alertId}'"
                                      conditional-section-runCommand:
                                        type: conditional
                                        expression:
                                          left: $actionType
                                          operator: "=="
                                          right: "runCommand"
                                        properties:
                                          runCommandGrid:
                                            type: grid
                                            ui:
                                              columns:
                                                - auto
                                                - auto
                                                - auto
                                            properties:
                                              command:
                                                type: string
                                                title: Command
                                                description: "Executable to run, e.g. /opt/scripts/notify.sh"
                                              args:
                                                type: string
                                                title: Arguments
                                                description: "Comma separated, e.g. ${exchangeProperty.alertId},${body[user]}"
                                              timeout:
                                                type: number
                                                title: Timeout (ms)
                                                defaultValue: 3600000
                                                description: "Default 3600000 (1 hour)"
          destinationSection:
            type: object
            properties:
              destinationHeader:
                type: header
                title: AlertServer Connection
              destinationContainer:
                type: object
                ui:
                  component: group
                properties:
                  commandConfig:
                    type: grid
                    ui:
                      columns:
                        - 25%
                        - auto
                      alignRow: baseline
                    properties:
                      destinationTitle:
                        type: grid
                        ui:
                          columns:
                            - auto
                            - 1fr
                          areas:
                            - description-text description-help
                          alignRow: center
                        properties:
                          description-text:
                            type: typography
                            defaultValue: AlertServer Connection Properties
                            ui:
                              indexed: true
                          description-help:
                            type: typography
                            ui:
                              icon: info-circle
                            help:
                              icon: info-circle
                              content: |-
                                ### AlertServer Connection Properties

                                  The following properties can be specified for the AlertServer Connection.

                                  | property | description |
                                  | -- | -- |
                                  | AlertServer Hostname / IP | The hostname or IP address of the AlertServer |
                                  | port | The port that AlertServer is listening on |
                      destinationValue:
                        type: object
                        properties:
                          destinationGrid:
                            type: grid
                            ui:
                              columns:
                                - auto
                                - auto
                            properties:
                              alertServerHost:
                                type: string
                                title: AlertServer Hostname / IP
                                defaultValue: "127.0.0.1"
                              alertServerPort:
                                type: number
                                title: AlertServer Port
                                defaultValue: 30000
          optionalSettings:
            type: expansion-panel
            title: Optional Settings
            ui:
              elevation: 2
            properties:
              togglePreprocessHeaders:
                type: switch
                title: Configure Pre-process Headers
                defaultValue: false
              conditional-section-preprocessHeaders:
                type: conditional
                expression:
                  left: $togglePreprocessHeaders
                  operator: '=='
                  right: true
                properties:
                  preprocessHeaders:
                    type: array
                    title: Pre-processing Headers Override
                    ui:
                      columns:
                        - auto
                        - auto
                    propertyTemplate:
                      expression:
                        type: text
                        title: The expression to match
                        help:
                          icon: info-circle
                          content: >-
                            ### Simple Expressions


                            > **field** _operator_ **value**


                            ##### field: the field that referenced from the incoming
                            message. To match against the whole string use
                            **\${bodyAs(String)}** , to reference a specific field use
                            **\${body[hostname]}**

                            ##### value: the value being tested against

                            ##### operators

                                ==          equals
                                =~          equals (case insensitive)
                                !=          does not equal
                                !=~         does not equal (case insensitive)
                                contains    contains string
                                !contains   does not contain
                                regex       matches regex expression
                                !regex      does not match regex expression
                                &&          AND multiple expressions
                                ||          OR multiple expressions

                            ##### See examples below

                                # match any string
                                ${bodyAs(String)} regex '(?s)(.*?)'
                                # incoming message contains 'this' but not 'that'
                                ${bodyAs(String)} =~ 'this' && ${bodyAs(String)} !=~ 'that'
                                # incoming message contains 'dog' or 'cat'
                                ${bodyAs(String)} =~ 'dog' || ${bodyAs(String)} !=~ 'cat'
                                # incoming message field 'username' equals 'ppadmin'
                                ${body[username]} == 'ppadmin'
                                # incoming message field 'username' is not null
                                ${body[username]} != null
                                # incoming message field 'origindate' equals todays date
                                ${body[origindate]} == ${date:now:yyyyMMdd}
                      headers:
                        type: map
                        title: Headers
                        ui:
                          keyPlaceholder: Header Name
                        valueSchema:
                          type: text
                          ui:
                            placeholder: Header Value
              toggleAllowDenyList:
                type: switch
                title: Configure Allow/Deny List
                defaultValue: false
              conditional-section-allow-deny:
                type: conditional
                expression:
                  left: $toggleAllowDenyList
                  operator: '=='
                  right: true
                properties:
                  allowList:
                    type: array
                    title: Allow list (process if expression is matched)
                    ui:
                      indexed: true
                    help:
                      icon: info-circle
                      content: >-
                        ### Simple Expressions


                        > **field** _operator_ **value**


                        ##### field: the field that referenced from the incoming
                        message. To match against the whole string use
                        **\${bodyAs(String)}** , to reference a specific field use
                        **\${body[hostname]}**

                        ##### value: the value being tested against

                        ##### operators

                            ==          equals
                            =~          equals (case insensitive)
                            !=          does not equal
                            !=~         does not equal (case insensitive)
                            contains    contains string
                            !contains   does not contain
                            regex       matches regex expression
                            !regex      does not match regex expression
                            &&          AND multiple expressions
                            ||          OR multiple expressions

                        ##### See examples below

                            # match any string
                            ${bodyAs(String)} regex '(?s)(.*?)'
                            # incoming message contains 'this' but not 'that'
                            ${bodyAs(String)} =~ 'this' && ${bodyAs(String)} !=~ 'that'
                            # incoming message contains 'dog' or 'cat'
                            ${bodyAs(String)} =~ 'dog' || ${bodyAs(String)} !=~ 'cat'
                            # incoming message field 'username' equals 'ppadmin'
                            ${body[username]} == 'ppadmin'
                            # incoming message field 'username' is not null
                            ${body[username]} != null
                            # incoming message field 'origindate' equals todays date
                            ${body[origindate]} == ${date:now:yyyyMMdd}
                  denyList:
                    type: array
                    title: Deny list (drop if expression is matched)
                    ui:
                      indexed: true
                    help:
                      icon: info-circle
                      content: >-
                        ### Simple Expressions


                        > **field** _operator_ **value**


                        ##### field: the field that referenced from the incoming
                        message. To match against the whole string use
                        **\${bodyAs(String)}** , to reference a specific field use
                        **\${body[hostname]}**

                        ##### value: the value being tested against

                        ##### operators

                            ==          equals
                            =~          equals (case insensitive)
                            !=          does not equal
                            !=~         does not equal (case insensitive)
                            contains    contains string
                            !contains   does not contain
                            regex       matches regex expression
                            !regex      does not match regex expression
                            &&          AND multiple expressions
                            ||          OR multiple expressions

                        ##### See examples below

                            # match any string
                            ${bodyAs(String)} regex '(?s)(.*?)'
                            # incoming message contains 'this' but not 'that'
                            ${bodyAs(String)} =~ 'this' && ${bodyAs(String)} !=~ 'that'
                            # incoming message contains 'dog' or 'cat'
                            ${bodyAs(String)} =~ 'dog' || ${bodyAs(String)} !=~ 'cat'
                            # incoming message field 'username' equals 'ppadmin'
                            ${body[username]} == 'ppadmin'
                            # incoming message field 'username' is not null
                            ${body[username]} != null
                            # incoming message field 'origindate' equals todays date
                            ${body[origindate]} == ${date:now:yyyyMMdd}
              toggleLogs:
                type: switch
                title: Configure Logging
                defaultValue: false
              conditional-section-logs:
                type: conditional
                expression:
                  left: $toggleLogs
                  operator: '=='
                  right: true
                properties:
                  uiMessageLimit:
                    type: number
                    title: UI Message Limit
                    defaultValue: 200
                    description: >-
                      Limit of failed/dropped/success/processed/received messages to
                      display on the UI
                  logOptions:
                    type: grid
                    ui:
                      columns:
                        - 20%
                        - auto
                      areas:
                        - logReceived logReceivedToDatahub
                        - logDropped logDroppedToDatahub
                        - logProcessed logProcessedToDatahub
                        - logSuccess logSuccessToDatahub
                        - logFailed logFailedToDatahub
                        - logDatahubDataSource logDatahubDataSource
                        - logMessageFields logMessageFields
                      alignRow: baseline
                    properties:
                      logReceived:
                        defaultValue: true
                        type: switch
                        title: Log messages received
                      logReceivedToDatahub:
                        defaultValue: false
                        type: checkbox
                        title: Log received messages to Datahub
                      logDropped:
                        defaultValue: true
                        type: switch
                        title: Log dropped messages
                      logDroppedToDatahub:
                        defaultValue: false
                        type: checkbox
                        title: Log dropped messages to Datahub
                      logProcessed:
                        type: switch
                        title: Log processed messages
                        defaultValue: true
                      logProcessedToDatahub:
                        defaultValue: false
                        type: checkbox
                        title: Log processed messages to Datahub
                      logSuccess:
                        defaultValue: true
                        type: switch
                        title: Log success messages
                      logSuccessToDatahub:
                        defaultValue: false
                        type: checkbox
                        title: Log success messages to Datahub
                      logFailed:
                        defaultValue: true
                        type: switch
                        title: Log failed messages
                      logFailedToDatahub:
                        defaultValue: false
                        type: checkbox
                        title: Log failed messages to Datahub
                      logDatahubDataSource:
                        type: datasource
                        title: Datahub Data Source
                        description: "Only required if logging to Datahub is enabled for any message type"
                        ui:
                          datasourceType: rest
                      logMessageFields:
                        defaultValue: false
                        type: switch
                        title: Log message fields
                        description: "Logs each field of the decoded message as the expression to use in filters and actions, e.g. ${body[closeAlert][alertId]} = 123 (String). Written to logs/<pipeline name>.log. Turn off once your expressions work."

      pipelineFlow:
        - type: block
          label: Webhook Listener
          icon: webhook
        - type: pipe
          children:
            - type: arrow
              forward: true
              pullBackward: true
            - type: block
              label: drop
              icon: trash-can
            - type: arrow
              forward: true
            - type: block
              label: filter
              icon: filter
            - type: arrow
              forward: true
            - type: block
              label: transform
              icon: shuffle
            - type: arrow
              forward: true
              pullForward: true
        - type: block
          icon: arrow-down-to-square
          label: "Forward to AlertServer"

      exceptions:
        # REF-AOD - Catch data conversion exceptions
        - catches:
            - "com.fasterxml.jackson.core.JsonParseException"
            - "com.fasterxml.jackson.core.io.JsonEOFException"
            - "org.yaml.snakeyaml.parser.ParserException"
          handled:
            type: constant
            expression: "true"
          use-original-message: true
          steps:
            # REF-OCY - Log the error
            - method: log
              level: ERROR
              message: "Error parsing body: ${body}. Caused by: ${exception.message}"
            # REF-GXV - Set header "CamelHttpResponseCode" to 400
            - method: setHeader
              key: CamelHttpResponseCode
              value:
                type: constant
                expression: 400
            # REF-1SL - Set header "Content-Type" to "text/plain"
            - method: setHeader
              key: Content-Type
              value:
                type: constant
                expression: application/json
            # REF-FG2 - Set body to message
            - method: setBody
              expression:
                type: simple
                expression: '{"status": "ERROR", "requestId": "${exchangeId}", "message": "Error parsing the body. Please check the logs for more details.", "body": ${body} }'
            - method: isslog
              message: "parentId=${exchange.properties[parentId]} | failed() | Error processing the body, please check the logs for more details. Exception=${exception.message}"
              type: failed
              queueSize: $[[uiMessageLimit]]
              writeToFile: $[[logFailed]]
              writeToDatabase: $[[logFailed]]
              writeToDatahub: $[[logFailedToDatahub]]
              datahubDataSource: $[[logDatahubDataSource]]
            - method: stop

        # REF-EJC - Catch genric exception
        - catches:
            - "java.lang.Exception"
          handled:
            type: constant
            expression: true
          steps:
            # REF- - Log the error
            - method: log
              level: ERROR
              message: "Error processing data: ${exception}"
            # REF-ONW - Set header "CamelHttpResponseCode" to 400
            - method: setHeader
              key: CamelHttpResponseCode
              value:
                type: constant
                expression: 400
            - method: setHeader
              key: Content-Type
              value:
                type: constant
                expression: application/json
            # REF-31X - Set body to error message
            - method: setBody
              expression:
                type: simple
                expression: '{"status": "ERROR", "requestId": "${exchangeId}", "message": "Error processing the body.\nPlease check message channel logs for more details." }'
            - method: isslog
              message: "parentId=${exchange.properties[parentId]} | failed() | Error processing the body, please check the logs for more details. Exception=${exception.message}"
              type: failed
              queueSize: $[[uiMessageLimit]]
              writeToFile: $[[logFailed]]
              writeToDatabase: $[[logFailed]]
              writeToDatahub: $[[logFailedToDatahub]]
              datahubDataSource: $[[logDatahubDataSource]]
            - method: stop

        # REF-M0L - Catch No payload
        - catches:
            - "org.apache.camel.NoTypeConversionAvailableException"
            - "com.fasterxml.jackson.databind.exc.MismatchedInputException"
          handled:
            type: constant
            expression: true
          steps:
            # REF- - Log the error
            - method: log
              level: ERROR
              message: "No content in the payload: ${exception}"
            # REF-PO0 - Set header "CamelHttpResponseCode" to 400
            - method: setHeader
              key: CamelHttpResponseCode
              value:
                type: constant
                expression: 400
            - method: setHeader
              key: Content-Type
              value:
                type: constant
                expression: application/json
            # REF-31X - Set body to error message
            - method: setBody
              expression:
                type: simple
                expression: '{"status": "ERROR", "requestId": "${exchangeId}", "message": "${exception.message}" }'
            - method: isslog
              message: "parentId=${exchange.properties[parentId]} | failed() | No content in body. Exception=${exception.message}"
              type: failed
              queueSize: $[[uiMessageLimit]]
              writeToFile: $[[logFailed]]
              writeToDatabase: $[[logFailed]]
              writeToDatahub: $[[logFailedToDatahub]]
              datahubDataSource: $[[logDatahubDataSource]]
            - method: stop

        # REF-XAG - Failed to send on socket
        - catches:
            - "java.net.ConnectException"
          handled:
            type: constant
            expression: true
          steps:
            # REF- - Log the error
            - method: log
              level: "ERROR"
              message: "Failed to send body to $[[alertServerHost]]:$[[alertServerPort]]"
            # REF-4KD - Write log message to failed file
            - method: isslog
              message: "parentId=${exchange.properties[parentId]} | failed(${exchange.properties['filterExpression']}) | [dest=$[[alertServerHost]]:$[[alertServerPort]]], message=${exchange.properties['internalProcessedMessage']}]"
              type: failed
              queueSize: $[[uiMessageLimit]]
              writeToFile: $[[logFailed]]
              writeToDatabase: $[[logFailed]]
              writeToDatahub: $[[logFailedToDatahub]]
              datahubDataSource: $[[logDatahubDataSource]]
            # Set the error response returned to the caller
            - method: setHeader
              key: CamelHttpResponseCode
              value:
                type: constant
                expression: 500
            - method: setBody
              expression:
                type: simple
                expression: '{"status": 500, "action": "FAILED", "requestId": "${exchange.properties[parentId]}", "message": "Failed to send to AlertServer, please check the logs for more details"}'
            - method: stop

        - catches:
            - "org.apache.camel.processor.ThrottlerRejectedExecutionException"
          handled:
            type: constant
            expression: true
          steps:
            # REF- - Log the error
            - method: log
              level: "ERROR"
              message: "Throttle limit reached, dropping message: ${exception}"

            # REF-PO0 - Set header "CamelHttpResponseCode" to 400
            - method: setHeader
              key: CamelHttpResponseCode
              value:
                type: constant
                expression: 400
            - method: setHeader
              key: Content-Type
              value:
                type: constant
                expression: application/json
            # REF-31X - Set body to error message
            - method: setBody
              expression:
                type: simple
                expression: '{"status": "ERROR", "requestId": "${exchangeId}", "message": "Throttle limit reached, dropping message: ${exception}" }'

            - method: isslog
              message: "dropped | ${exception}"
              type: dropped
              writeToFile: $[[logDropped]]
              writeToDatabase: $[[logDropped]]
              queueSize: $[[uiMessageLimit]]
              writeToDatahub: $[[logDroppedToDatahub]]
              datahubDataSource: $[[logDatahubDataSource]]
            - method: stop

        - catches:
          - "com.interlinksoftware.integrationhub.config.step.processor.exceptions.AlertLookupNotFoundException"
          handled:
            type: constant
            expression: true
          steps:
            - method: log
              level: ERROR
              message: "${exception}"
            - method: setHeader
              key: CamelHttpResponseCode
              value:
                type: constant
                expression: 404
            - method: setHeader
              key: Content-Type
              value:
                type: constant
                expression: application/json
            # REF-31X - Set body to error message
            - method: setBody
              expression:
                type: simple
                expression: '{"status": 404, "requestId": "${exchangeId}", "message": "${exception.message}" }'
            - method: isslog
              message: "parentId=${exchange.properties[parentId]} | failed() | ${exception.message}"
              type: failed
              queueSize: $[[uiMessageLimit]]
              writeToFile: $[[logFailed]]
              writeToDatabase: $[[logFailed]]
              writeToDatahub: $[[logFailedToDatahub]]
              datahubDataSource: $[[logDatahubDataSource]]
            - method: stop

      steps:
        # REF-36J - HTTP Listener
        - method: from
          component: rest
          properties:
            method: post
            path: "$[[path]]"
            component: jetty
            uriTemplate: ""
            scheme: "$[[protocol]]"
            host: $[[hostname]]
            port: $[[port]]
            enableCORS: true
            sendServerVersion: false
            matchOnUriPrefix: true
            sslContextParameters: "$[[sslContextParameters]]"
            endpointProperties:
              security:
                enabled: $[[authEnabled]]
                type: basic
                realm: $[[pipeline.id]]
                users: $[[users]]

        # Throttle only when enabled - the throttle step has no 'enabled' property and $[[...]] cannot negate a value
        - method: choice
          when:
            - predicate:
                type: simple
                expression: "${exchangeProperty.placeholders[throttleEnabled]} == true"
              steps:
                - method: throttle
                  disabled: false
                  count: $[[throttleCount]]
                  period: $[[throttlePeriod]]
                  rejectExecution: true
                # Must follow the throttle: the choice step only closes itself properly when its last step is not a
                # container like throttle - otherwise every later step is nested in this branch and skipped when disabled
                - method: log
                  level: "DEBUG"
                  message: "Request within throttle limit"

        # REF- -  Api key check
        - method: choice
          when:
            - predicate:
                type: simple
                expression: "${exchangeProperty.placeholders[apiKey]} != '' && ${exchangeProperty.placeholders[apiKey]} != null"
              steps:
                - method: choice
                  when:
                    - predicate:
                        type: simple
                        expression: "${header.apiKey} != ${exchangeProperty.placeholders[apiKey]}"
                      steps:
                        # REF- - Log Error
                        - method: log
                          level: "ERROR"
                          message: "apiKey '${header.apiKey}' is incorrect"
                        # REF- - Set header "CamelHttpResponseCode" to 400
                        - method: setHeader
                          key: CamelHttpResponseCode
                          value:
                            type: constant
                            expression: 401
                        # REF- - Set body to error message
                        - method: setBody
                          expression:
                            type: constant
                            expression: '{"status": 401, "error": "Access Denied - API key is incorrect"}'
                        # REF- - Set content type header
                        - method: setHeader
                          key: Content-Type
                          value:
                            type: constant
                            expression: application/json
                        - method: stop

        # REF-B9G - Store incoming message as "internalOrigMsg" property
        - method: setProperty
          key: internalOrigMsg
          value:
            type: "simple"
            expression: "${body}"

        # REF- - Set header "requestId" to the initial "parent" correlationId
        - method: setProperty
          key: parentId
          value:
            type: "simple"
            expression: "${exchangeId}"

        # REF- - Store headers in exchange
        - method: process
          classname: com.interlinksoftware.integrationhub.config.step.processor.HeadersToPropertyProcessor

        # REF- - WARN message
        - method: log
          level: "DEBUG"
          message: "Writing body to received file"

        # REF-H9Z - Log message to file
        - method: isslog
          message: "received | ${bodyAs(String)}"
          type: received
          queueSize: $[[uiMessageLimit]]
          writeToFile: $[[logReceived]]
          writeToDatabase: $[[logReceived]]
          writeToDatahub: $[[logReceivedToDatahub]]
          datahubDataSource: $[[logDatahubDataSource]]

        # REF- - Set body to origin message
        - method: setBody
          expression:
            type: simple
            expression: "${exchangeProperty.internalOrigMsg}"

        - method: choice
          when:
            - predicate:
                type: simple
                expression: "${exchangeProperty.placeholders[preprocessHeaders]} != null && ${exchangeProperty.placeholders[preprocessHeaders]} != 'NOT_SET' && ${exchangeProperty.placeholders[preprocessHeaders]} is 'java.util.List' && ${exchangeProperty.placeholders[preprocessHeaders].size()} > 0"
              steps:
                - method: loop
                  expression:
                    type: simple
                    expression: "${exchangeProperty.placeholders[preprocessHeaders].size()}"
                  copy: false
                  steps:
                    - method: choice
                      when:
                        - predicate:
                            type: simple
                            expression: "${exchangeProperty.placeholders[preprocessHeaders].get(${header.CamelLoopIndex}).getOrDefault(expression, NOT_SET)} != 'NOT_SET'"
                          steps:
                            - method: setProperty
                              key: preprocessHeaderExpression
                              value:
                                type: "simple"
                                expression: "${exchangeProperty.placeholders[preprocessHeaders].get(${header.CamelLoopIndex})[expression]}"
                            - method: choice
                              when:
                                - predicate:
                                    type: simple
                                    expression: "${exchangeProperty.placeholders[preprocessHeaders].get(${header.CamelLoopIndex}).getOrDefault(headers, NOT_SET)} != 'NOT_SET' && ${exchangeProperty.placeholders[preprocessHeaders].get(${header.CamelLoopIndex})[headers]} is 'java.util.Map'"
                                  steps:
                                    - method: choice
                                      when:
                                        - predicate:
                                            type: groovy
                                            expression: |
                                              preprocessHeaderExpression = exchange.properties.get("preprocessHeaderExpression")
                                              language = exchange.getContext().resolveLanguage("simple")
                                              predicate = language.createPredicate(preprocessHeaderExpression)
                                              return predicate.matches(exchange);
                                          steps:
                                            - method: log
                                              level: "DEBUG"
                                              message: "Preprocess header expression(${exchangeProperty.preprocessHeaderExpression}) matches!!"
                                            - method: setBody
                                              expression:
                                                type: simple
                                                expression: "${exchangeProperty.placeholders[preprocessHeaders].get(${header.CamelLoopIndex})[headers]}"
                                            - method: process
                                              classname: com.interlinksoftware.integrationhub.config.step.processor.BodyToHeadersProcessor
                                      otherwise:
                                        - method: log
                                          level: "DEBUG"
                                          message: "Preprocess header expression(${exchangeProperty.preprocessHeaderExpression}) does not match"
                              otherwise:
                                - method: log
                                  level: "ERROR"
                                  message: "No headers for expression(exchangeProperty.preprocessHeaderExpression) in preprocessor definition '(${header.CamelLoopIndex})'"
                      otherwise:
                        - method: log
                          level: "ERROR"
                          message: "No expression in preprocessor definition '${header.CamelLoopIndex}'"
          otherwise:
            - method: log
              level: "DEBUG"
              message: "No preprocessor definitions"

        # REF- - Set body to origin message
        - method: setBody
          expression:
            type: simple
            expression: "${exchangeProperty.internalOrigMsg}"

        # REF-4IZ - Data decoding
        - method: choice
          when:
            # REF-BEK
            - predicate:
                type: simple
                expression: "${header.Content-Encoding} in 'gzip,application/gzip'"
              steps:
                # REF- - WARN message
                - method: log
                  level: "DEBUG"
                  message: "decoding from gzip"
                - method: unmarshal
                  type: gzip

        # REF-1CY -  Datatype decoding
        - method: choice
          when:
            # REF-0KL - Unmarshal JSON
            - predicate:
                type: simple
                expression: "${header.Content-Type} ~~ 'json'"
              steps:
                # REF- - WARN message
                - method: log
                  level: "DEBUG"
                  message: "decoding from json"
                - method: unmarshal
                  type: json
                - method: choice
                  when:
                    - predicate:
                        type: simple
                        expression: "${body.getClass().getName()} == 'java.lang.String'"
                      steps:
                        - method: log
                          level: "DEBUG"
                          message: "decoding from json string - ${body.getClass().getName()}"
                        - method: unmarshal
                          type: json
                # Cache the unmarshalled body
                - method: setProperty
                  key: unmarshalledBody
                  value:
                    type: "simple"
                    expression: "${body}"
                # Append correlationId into the body
                - method: setBody
                  expression:
                    type: "groovy"
                    expression: |
                      if (body instanceof Map) {
                        body["correlationId"] = exchange.properties["parentId"]
                      }

                      if (body instanceof ArrayList) {
                        body.eachWithIndex { it, i ->
                          if (it instanceof Map) {
                            body[i]["correlationId"] = exchange.properties["parentId"]
                          }
                        }
                      }

                      return body
                # Convert the body back to its orig type
                - method: marshal
                  type: json
                # Cache this body for use later on in the template
                - method: setProperty
                  key: rawBody
                  value:
                    type: "simple"
                    expression: "${bodyAs(String)}"
            # REF-FU6 - Unmarshal XML
            - predicate:
                type: simple
                expression: "${header.Content-Type} ~~ 'xml'"
              steps:
                # REF- - WARN message
                - method: log
                  level: "DEBUG"
                  message: "decoding from xml"
                - method: unmarshal
                  type: xml
                # Elements with attributes (e.g. SOAP xsi:type) unmarshal to {attr=..., ''=text}.
                # Collapse them to their text so expressions can use ${body[Body][closeAlert][alertId]}.
                # ponytail: the element's attributes are dropped - keep them if a use case needs them
                - method: setBody
                  expression:
                    type: groovy
                    expression: |
                      def collapse
                      collapse = { node ->
                        if (node instanceof Map) {
                          if (node.containsKey('')) return collapse(node[''])
                          def result = [:]
                          node.each { k, v -> result[k] = collapse(v) }
                          return result
                        }
                        if (node instanceof List) return node.collect { collapse(it) }
                        return node
                      }
                      return collapse(body)
                # Cache the unmarshalled body
                - method: setProperty
                  key: unmarshalledBody
                  value:
                    type: "simple"
                    expression: "${body}"
                # Append correlationId into the body
                - method: setBody
                  expression:
                    type: "groovy"
                    expression: |
                      body["correlationId"] = exchange.properties["parentId"]
                      return body
                # Convert the body back to its orig type
                - method: marshal
                  type: xml
                # Cache this body for use later on in the template
                - method: setProperty
                  key: rawBody
                  value:
                    type: "simple"
                    expression: "${bodyAs(String)}"
            # REF-5JV - Unmarshal YAML
            - predicate:
                type: simple
                expression: "${header.Content-Type} ~~ 'yaml'"
              steps:
                # REF- - WARN message
                - method: log
                  level: "DEBUG"
                  message: "decoding from yaml"
                - method: unmarshal
                  type: yaml
                # Cache the unmarshalled body
                - method: setProperty
                  key: unmarshalledBody
                  value:
                    type: "simple"
                    expression: "${body}"
                # Append correlationId into the body
                - method: setBody
                  expression:
                    type: "groovy"
                    expression: |
                      body["correlationId"] = exchange.properties["parentId"]
                      return body
                # Convert the body back to its orig type
                - method: marshal
                  type: yaml
                # Cache this body for use later on in the template
                - method: setProperty
                  key: rawBody
                  value:
                    type: "simple"
                    expression: "${bodyAs(String)}"
          # REF-SCT - If datatype is unknown
          otherwise:
            # REF- - WARN message
            - method: log
              level: "DEBUG"
              message: "datatype '${header.Content-Type}' unknown"
            # REF- - WARN message
            - method: log
              level: "DEBUG"
              message: "writing to received file"

            # REF-4UJ - Write log message to file
            - method: isslog
              message: "parentId=${exchange.properties[parentId]} | missed(${header.Content-Type}) | ${bodyAs(String)}"
              type: received
              queueSize: $[[uiMessageLimit]]
              writeToFile: $[[logReceived]]
              writeToDatabase: $[[logReceived]]
              writeToDatahub: $[[logReceivedToDatahub]]
              datahubDataSource: $[[logDatahubDataSource]]

            # REF-0OP - Set header "CamelHttpResponseCode" to 400
            - method: setHeader
              key: CamelHttpResponseCode
              value:
                type: constant
                expression: 400
            # REF-JEF - Set Body to error message
            - method: setBody
              expression:
                type: simple
                expression: "Unknown datatype '${header.Content-Type}'\\n"
            # Stop processing any further
            - method: stop

        # Set the body back to the unmarshalled format
        - method: setBody
          expression:
            type: "simple"
            expression: "${exchangeProperty.unmarshalledBody}"

        - method: split
          aggregation-strategy:
            type: collect-to-property
          resolve-maps-as-key-value: false
          expressions:
            - type: simple
              expression: "${body}"
          steps:

            # Log each decoded field as the expression that references it, to help build filter/action expressions
            - method: choice
              when:
                - predicate:
                    type: simple
                    expression: "${exchangeProperty.placeholders[logMessageFields]} == true"
                  steps:
                    - method: setProperty
                      key: messageFields
                      value:
                        type: groovy
                        expression: |
                          def lines = []
                          def walk
                          walk = { node, path ->
                            if (node instanceof Map) {
                              if (node.isEmpty()) lines << path + ' = {} (empty map)'
                              node.each { k, v -> walk(v, path + '[' + k + ']') }
                            } else if (node instanceof List) {
                              if (node.isEmpty()) lines << path + ' = [] (empty list)'
                              node.eachWithIndex { v, i -> walk(v, path + '[' + i + ']') }
                            } else {
                              lines << '$' + '{' + path + '} = ' + node + ' (' + (node == null ? 'null' : node.getClass().getSimpleName()) + ')'
                            }
                          }
                          walk(body, 'body')
                          return lines.join('\n')
                    # The pipeline's logger writes to logs/<pipeline name>.log
                    - method: log
                      level: "INFO"
                      message: "Message fields (parentId=${exchangeProperty.parentId}):\n${exchangeProperty.messageFields}"

            # REF- - Handle allow list
            - method: choice
              when:
                - predicate:
                    type: simple
                    expression: "${exchangeProperty.placeholders[allowList]} != null && ${exchangeProperty.placeholders[allowList]} != 'NOT_SET' && ${exchangeProperty.placeholders[allowList]} is 'java.util.List' && ${exchangeProperty.placeholders[allowList].size()} > 0"
                  steps:
                    - method: loop
                      expression:
                        type: simple
                        expression: "${exchangeProperty.placeholders[allowList].size()}"
                      copy: false
                      steps:
                        - method: setProperty
                          key: allowListExpression
                          value:
                            type: "simple"
                            expression: "${exchangeProperty.placeholders[allowList].get(${header.CamelLoopIndex})}"
                        - method: choice
                          when:
                            - predicate:
                                type: groovy
                                expression: |
                                  allowListExpression = exchange.properties.get("allowListExpression")
                                  language = exchange.getContext().resolveLanguage("simple")
                                  predicate = language.createPredicate(allowListExpression)
                                  return predicate.matches(exchange);
                              steps:
                                - method: log
                                  level: "DEBUG"
                                  message: "allowList expression(${exchangeProperty.allowListExpression}) matches"
                                - method: setProperty
                                  key: allowListCheck
                                  value:
                                    type: "constant"
                                    expression: true
                          otherwise:
                            - method: log
                              level: "DEBUG"
                              message: "allowList expression(${exchangeProperty.allowListExpression}) does not match"
                            - method: setProperty
                              key: allowListCheck
                              value:
                                type: groovy
                                expression: |
                                  prop = exchange.properties.getOrDefault("allowListCheck", "NOT_SET")
                                  if (prop == "NOT_SET") {
                                    return false;
                                  } else {
                                    return prop;
                                  }
              otherwise:
                - method: log
                  level: "DEBUG"
                  message: "No allowList definitions"

            - method: choice
              when:
                - predicate:
                    type: "simple"
                    expression: "${exchangeProperty.allowListCheck.toString()} =~ 'false'"
                  steps:
                    - method: log
                      level: "DEBUG"
                      message: "Message not allowed by allowList"
                    - method: isslog
                      message: "dropped | ${bodyAs(String)}"
                      type: dropped
                      writeToFile: $[[logDropped]]
                      writeToDatabase: $[[logDropped]]
                      queueSize: $[[uiMessageLimit]]
                      writeToDatahub: $[[logDroppedToDatahub]]
                      datahubDataSource: $[[logDatahubDataSource]]
                    - method: setBody
                      expression:
                        type: simple
                        expression: '{ "status": "dropped", "requestId": "${exchangeId}"}'
                    - method: stop

            # REF- - Handle deny list
            - method: choice
              when:
                - predicate:
                    type: simple
                    expression: "${exchangeProperty.placeholders[denyList]} != null && ${exchangeProperty.placeholders[denyList]} != 'NOT_SET' && ${exchangeProperty.placeholders[denyList]} is 'java.util.List' && ${exchangeProperty.placeholders[denyList].size()} > 0"
                  steps:
                    - method: loop
                      expression:
                        type: simple
                        expression: "${exchangeProperty.placeholders[denyList].size()}"
                      copy: false
                      steps:
                        - method: setProperty
                          key: denyListExpression
                          value:
                            type: "simple"
                            expression: "${exchangeProperty.placeholders[denyList].get(${header.CamelLoopIndex})}"
                        - method: choice
                          when:
                            - predicate:
                                type: groovy
                                expression: |
                                  denyListExpression = exchange.properties.get("denyListExpression")
                                  language = exchange.getContext().resolveLanguage("simple")
                                  predicate = language.createPredicate(denyListExpression)
                                  return predicate.matches(exchange);
                              steps:
                                - method: log
                                  level: "DEBUG"
                                  message: "denyList expression(${exchangeProperty.denyListExpression}) matches"
                                - method: setProperty
                                  key: denyListCheck
                                  value:
                                    type: "constant"
                                    expression: true
                          otherwise:
                            - method: log
                              level: "DEBUG"
                              message: "denyList expression(${exchangeProperty.denyListExpression}) does not match"
                            - method: setProperty
                              key: denyListCheck
                              value:
                                type: groovy
                                expression: |
                                  prop = exchange.properties.getOrDefault("denyListCheck", "NOT_SET")
                                  if (prop == "NOT_SET") {
                                    return false;
                                  } else {
                                    return prop;
                                  }
              otherwise:
                - method: log
                  level: "DEBUG"
                  message: "No denyList definitions"

            - method: choice
              when:
                - predicate:
                    type: "simple"
                    expression: "${exchangeProperty.denyListCheck.toString()} =~ 'true'"
                  steps:
                    - method: log
                      level: "DEBUG"
                      message: "Message not allowed by denyList"
                    - method: isslog
                      message: "dropped | ${bodyAs(String)}"
                      type: dropped
                      writeToFile: $[[logDropped]]
                      writeToDatabase: $[[logDropped]]
                      queueSize: $[[uiMessageLimit]]
                      writeToDatahub: $[[logDroppedToDatahub]]
                      datahubDataSource: $[[logDatahubDataSource]]
                    - method: setBody
                      expression:
                        type: simple
                        expression: '{ "status": "dropped", "requestId": "${exchangeId}"}'
                    - method: stop

            # REF-IS2 - If the message matches a template key
            - method: setProperty
              key: actionResponses
              value:
                type: groovy
                expression: |
                  def responses = []
                  return responses

            - method: choice
              when:
                - predicate:
                    type: simple
                    expression: "${exchangeProperty.placeholders[filters]} != null && ${exchangeProperty.placeholders[filters]} != 'NOT_SET' && ${exchangeProperty.placeholders[filters]} is 'java.util.List' && ${exchangeProperty.placeholders[filters].size()} > 0"
                  steps:
                    - method: setProperty
                      key: continueFilterLoop
                      value:
                        type: constant
                        expression: true
                    - method: setProperty
                      key: filterListSize
                      value:
                        type: simple
                        expression: "${exchangeProperty.placeholders[filters].size()}"
                    - method: doWhile
                      predicate:
                        type: simple
                        expression: "${exchangeProperty.continueFilterLoop}"
                      copy: false
                      steps:
                        - method: choice
                          when:
                            - predicate:
                                type: groovy
                                expression: |
                                  def loopIndex = exchange.properties.get('filterLoopIndex', "0") as int;
                                  def filterListSize = exchange.properties.get('filterListSize');
                                  if (loopIndex >= filterListSize) {
                                    // Exit from loop
                                    exchange.properties.put("continueFilterLoop", false)
                                    return false
                                  }

                                  def filters = exchange.properties.get('placeholders').get('filters')
                                  def filterExpression = filters[loopIndex].get('expression')

                                  exchange.properties.put("filterExpression", filterExpression)

                                  filterExpression = exchange.properties.get("filterExpression")
                                  language = exchange.getContext().resolveLanguage("simple")
                                  predicate = language.createPredicate(filterExpression)
                                  result = predicate.matches(exchange);
                                  exchange.properties.put("continueFilterLoop", !result)
                                  return result
                              steps:
                                # REF- - WARN message
                                - method: log
                                  level: "DEBUG"
                                  message: "body '${body}' has matched template statement '${exchangeProperty.filterExpression}'"
                                - method: setProperty
                                  key: filterCheck
                                  value:
                                    type: "constant"
                                    expression: true
                                # REF-8R9 - Set property "internalMatchFound" to true
                                - method: setProperty
                                  key: internalMatchFound
                                  value:
                                    type: "constant"
                                    expression: true

                                - method: setProperty
                                  key: originMessage
                                  value:
                                    type: "simple"
                                    expression: "${body}"

                                # Set alertId from incoming payload
                                - method: setProperty
                                  key: alertId
                                  value:
                                    type: groovy
                                    expression: |
                                      def language = exchange.getContext().resolveLanguage("simple")
                                      def loopIndex = exchange.properties.get("filterLoopIndex") as int
                                      def filters = exchange.properties.get('placeholders').get('filters')
                                      def filter = filters[loopIndex]

                                      def processLastAlertOnly = filter.get('processLastAlertOnly', false) as boolean
                                      def alertid = language.createExpression(filter.alertId).evaluate(exchange, Object)

                                      if (processLastAlertOnly && alertid instanceof List) {
                                        return alertid.isEmpty() ? null : alertid.last()
                                      }

                                      return alertid

                                - method: log
                                  level: "DEBUG"
                                  message: "Looking up alert with id [${exchangeProperty.alertId}] using filter expression [${exchangeProperty.filterExpression}]"

                                # Lookup alert details using the incoming alertId
                                - method: process-with-properties
                                  classname: com.interlinksoftware.integrationhub.config.step.processor.AlertLookupProcessor
                                  properties:
                                    dataSource: "$[[alertLookupDatasource]]"
                                    eventDaemonHost: $[[eventDaemonHost]]
                                    eventDaemonPort: $[[eventDaemonPort]]
                                    lookupFieldName: alertId
                                    throwOnError: false

                                # If loadedAlert is null, return an error in the response
                                - method: choice
                                  when:
                                    - predicate:
                                        type: simple
                                        expression: "${exchangeProperty.loadedAlert} == null"
                                      steps:
                                        - method: log
                                          level: WARN
                                          message: "No matching alert found for id [${exchangeProperty.alertId}]"
                                        - method: isslog
                                          message: "parentId=${exchange.properties[parentId]} | failed() | No matching alert was found for id [${exchangeProperty.alertId}]"
                                          type: failed
                                          queueSize: $[[uiMessageLimit]]
                                          writeToFile: $[[logFailed]]
                                          writeToDatabase: $[[logFailed]]
                                          writeToDatahub: $[[logFailedToDatahub]]
                                          datahubDataSource: $[[logDatahubDataSource]]
                                        - method: marshal
                                          type: json
                                        - method: setBody
                                          expression:
                                            type: simple
                                            expression: '{"status": 400, "action": "FAILED", "message": "No matching alert was found for id [${exchangeProperty.alertId}]"}'
                                        - method: stop
                                  otherwise:
                                    - method: choice
                                      when:
                                        - predicate:
                                            type: simple
                                            expression: "${exchangeProperty.loadedAlert[state]} == '1'"
                                          steps:
                                            - method: log
                                              level: DEBUG
                                              message: "Loaded alert [${exchangeProperty.loadedAlert[id]}] exists and state = 1 -- Processing further..."
                                            # Store orig payload in property
                                            - method: setProperty
                                              key: origBody
                                              value:
                                                type: simple
                                                expression: "${body}"

                                            # Escape \n characters in loadedAlert
                                            - method: setProperty
                                              key: loadedAlert
                                              value:
                                                type: groovy
                                                expression: |
                                                  def escapeInvalidCharactersInMap(map) {
                                                      if (map instanceof Map) {
                                                          map.each { key, value ->
                                                              if (value instanceof String) {
                                                                  // Replace all valid escape sequences first
                                                                  def newValue = value
                                                                      .replaceAll("\\\\b", "\\\\\\\\b")  // \b to \\b
                                                                      .replaceAll("\\\\f", "\\\\\\\\f")  // \f to \\f
                                                                      .replaceAll("\\\\n", "\\\\\\\\n")  // \n to \\n
                                                                      .replaceAll("\\\\r", "\\\\\\\\r")  // \r to \\r
                                                                      .replaceAll("\\\\t", "\\\\\\\\t")  // \t to \\t
                                                                      .replaceAll("\\\"", "\\\\\"")     // \" to \"
                                                                      .replaceAll("\\\\", "\\\\\\\\")    // \ to \\
                                                                  // Remove any remaining invalid escape sequences
                                                                  newValue = newValue.replaceAll("\\\\(?![bfnrt\"\\\\])", "")
                                                                  map[key] = newValue
                                                              }
                                                          }
                                                      } else {
                                                          return map
                                                      }
                                                      return map
                                                  }

                                                  def loadedAlert = exchange.properties.get('loadedAlert')
                                                  def escapedMap = escapeInvalidCharactersInMap(loadedAlert)
                                                  return escapedMap

                                            # Set body back to orig payload
                                            - method: setBody
                                              expression:
                                                type: simple
                                                expression: "${exchangeProperty.origBody}"

                                            # Get actionTypes from matched filter
                                            - method: setProperty
                                              key: actionTypes
                                              value:
                                                type: groovy
                                                expression: |
                                                  def language = exchange.getContext().resolveLanguage("simple")
                                                  def loopIndex = exchange.properties.get("filterLoopIndex") as int
                                                  def filters = exchange.properties.get('placeholders').get('filters')
                                                  def filter = filters[loopIndex]

                                                  def actionTypes = filter.get('actions').collect { action ->
                                                    action.value.get('actionType')
                                                  }

                                                  return actionTypes

                                            - method: log
                                              level: DEBUG
                                              message: "Actions for matched filter: [${exchangeProperty.actionTypes}]"

                                            - method: setProperty
                                              key: eventDateTimestamp
                                              value:
                                                type: simple
                                                expression: "$simple{date:now:yyyy-MM-dd HH:mm:ss.SSS}"

                                            - method: setProperty
                                              key: propertySetter
                                              value:
                                                type: groovy
                                                expression: |
                                                  def language = exchange.getContext().resolveLanguage("simple")
                                                  def loopIndex = exchange.properties.get("filterLoopIndex") as int
                                                  def filter = exchange.properties.get('placeholders').get('filters')[loopIndex]

                                                  def actions = filter.get('actions')

                                                  actions.each { action ->
                                                      def actionConfig = action.value
                                                      def actionType = actionConfig.get('actionType')

                                                      if (actionType == "assignAlert" || actionType == "closeAlert") {
                                                        exchange.properties.put("operator", language.createExpression(actionConfig.operator).evaluate(exchange, String))
                                                      }

                                                      if (actionType == "closeAlert") {
                                                        exchange.properties.put("closeType", language.createExpression((actionConfig.closeType ?: "2").toString()).evaluate(exchange, int))
                                                      } else if (actionType == "addNote") {
                                                        def resolvedNote = language.createExpression(actionConfig.note).evaluate(exchange, String)
                                                        exchange.properties.put("note", resolvedNote)
                                                      } else if (actionType == "updateField") {
                                                        def resolvedFieldName = language.createExpression(actionConfig.fieldName).evaluate(exchange, String)
                                                        def resolvedFieldValue = language.createExpression(actionConfig.fieldValue).evaluate(exchange, String)
                                                        exchange.properties.put("fieldName", resolvedFieldName)
                                                        exchange.properties.put("fieldValue", resolvedFieldValue)
                                                      } else if (actionType == "updateDB") {
                                                        def sql = language.createExpression(actionConfig.statement).evaluate(exchange, String)
                                                        exchange.properties.put("sql", sql)
                                                      } else if (actionType == "runCommand") {
                                                        def command = language.createExpression(actionConfig.command).evaluate(exchange, String)
                                                        def args = language.createExpression(actionConfig.args).evaluate(exchange, List)
                                                        def timeout = actionConfig.timeout?:3600000
                                                        exchange.properties.put("command", command)
                                                        exchange.properties.put("args", args)
                                                        exchange.properties.put("timeout", timeout)
                                                      }
                                                  }

                                                  return

                                            # Handle close alert
                                            - method: choice
                                              when:
                                                - predicate:
                                                    type: simple
                                                    expression: "'closeAlert' in ${exchangeProperty.actionTypes}"
                                                  steps:
                                                    - method: log
                                                      level: DEBUG
                                                      message: "Processing action [closeAlert]"
                                                    - method: setProperty
                                                      key: closeAlertString
                                                      value:
                                                        type: simple
                                                        expression: '<C><alertId>${exchangeProperty.alertId}</alertId><currentOperator>${exchangeProperty.operator}</currentOperator><timeClosed>${exchangeProperty.eventDateTimestamp}</timeClosed><type>${exchangeProperty.closeType}</type><eventtime>${exchangeProperty.eventDateTimestamp}</eventtime></C>'
                                                    - method: setProperty
                                                      key: internalProcessedMessage
                                                      value:
                                                        type: simple
                                                        expression: |
                                                          ${exchangeProperty.closeAlertString}
                                                    - method: setBody
                                                      expression:
                                                        type: simple
                                                        expression: "${exchangeProperty.internalProcessedMessage}"
                                                    - method: log
                                                      level: "DEBUG"
                                                      message: "writing to processed file"
                                                    # REF-4MH - Log message to file
                                                    - method: isslog
                                                      message: "parentId=${exchange.properties[parentId]} | processed(closeAlert) | ${bodyAs(String)}"
                                                      type: processed
                                                      queueSize: $[[uiMessageLimit]]
                                                      writeToFile: $[[logProcessed]]
                                                      writeToDatabase: $[[logProcessed]]
                                                      writeToDatahub: $[[logProcessedToDatahub]]
                                                      datahubDataSource: $[[logDatahubDataSource]]

                                                    # Send close to AlertServer
                                                    - method: to
                                                      component: netty
                                                      properties:
                                                        protocol: tcp
                                                        host: "$[[alertServerHost]]"
                                                        port: "$[[alertServerPort]]"
                                                        clientMode: true
                                                        reconnect: true
                                                        producerPoolEnabled: true
                                                        sync: true
                                                        textline: true
                                                    - method: log
                                                      level: DEBUG
                                                      message: "Response code from AlertServer [${body}]"
                                                    - method: choice
                                                      when:
                                                        - predicate:
                                                            type: simple
                                                            expression: "${body.startsWith('0')}"
                                                          steps:
                                                            - method: log
                                                              level: "DEBUG"
                                                              message: "writing to the success file"
                                                            - method: isslog
                                                              message: "parentId=${exchange.properties[parentId]} | success(closeAlert) | Successfully closed alert [${exchangeProperty.alertId}] | AlertServer response = ${body}"
                                                              type: success
                                                              queueSize: $[[uiMessageLimit]]
                                                              writeToFile: $[[logSuccess]]
                                                              writeToDatabase: $[[logSuccess]]
                                                              writeToDatahub: $[[logSuccessToDatahub]]
                                                              datahubDataSource: $[[logDatahubDataSource]]
                                                            - method: setProperty
                                                              key: actionResponses
                                                              value:
                                                                type: groovy
                                                                expression: |
                                                                  def responses = exchange.properties.get('actionResponses') ?: []
                                                                  responses.add([
                                                                    status: 200,
                                                                    action: 'SUCCESS',
                                                                    actionType: 'closeAlert',
                                                                    message: "Successfully closed alert [${exchange.properties.get('alertId')}]".toString(),
                                                                    alertServerResponse: exchange.getMessage().getBody()?.toString(),
                                                                    payload: [alertServerResponse: exchange.getMessage().getBody()?.toString()]
                                                                  ])
                                                                  return responses
                                                            - method: setBody
                                                              expression:
                                                                type: groovy
                                                                expression: |
                                                                  return [
                                                                    status: 200,
                                                                    action: 'COMPLETED',
                                                                    requestId: exchange.properties.get('parentId'),
                                                                    alertId: exchange.properties.get('alertId'),
                                                                    responses: exchange.properties.get('actionResponses') ?: []
                                                                  ]
                                                      otherwise:
                                                        - method: log
                                                          level: "DEBUG"
                                                          message: "writing to the failed file"
                                                        - method: isslog
                                                          message: "parentId=${exchange.properties[parentId]} | failed(closeAlert) | Failed to close alert [${exchangeProperty.alertId}] | AlertServer response = ${body}"
                                                          type: failed
                                                          queueSize: $[[uiMessageLimit]]
                                                          writeToFile: $[[logFailed]]
                                                          writeToDatabase: $[[logFailed]]
                                                          writeToDatahub: $[[logFailedToDatahub]]
                                                          datahubDataSource: $[[logDatahubDataSource]]
                                                        - method: setProperty
                                                          key: alertServerResponse
                                                          value:
                                                            type: simple
                                                            expression: "${body}"
                                                        - method: setProperty
                                                          key: actionResponses
                                                          value:
                                                            type: groovy
                                                            expression: |
                                                              def responses = exchange.properties.get('actionResponses') ?: []
                                                              responses.add([
                                                                status: 400,
                                                                action: 'FAILED',
                                                                actionType: 'closeAlert',
                                                                message: "Failed to close alert [${exchange.properties.get('alertId')}]".toString(),
                                                                alertServerResponse: exchange.properties.get('alertServerResponse'),
                                                                payload: [alertServerResponse: exchange.properties.get('alertServerResponse')]
                                                              ])
                                                              return responses
                                                        - method: setBody
                                                          expression:
                                                            type: groovy
                                                            expression: |
                                                              return [
                                                                status: 400,
                                                                action: 'FAILED',
                                                                requestId: exchange.properties.get('parentId'),
                                                                alertId: exchange.properties.get('alertId'),
                                                                responses: exchange.properties.get('actionResponses') ?: []
                                                              ]

                                            # Handle assign alert
                                            - method: choice
                                              when:
                                                - predicate:
                                                    type: simple
                                                    expression: "'assignAlert' in ${exchangeProperty.actionTypes}"
                                                  steps:
                                                    - method: log
                                                      level: DEBUG
                                                      message: "Processing action [assignAlert]"
                                                    - method: log
                                                      level: DEBUG
                                                      message: "Checking if alert [${exchangeProperty.alertId}] is already assigned..."
                                                    - method: log
                                                      level: DEBUG
                                                      message: "Current Operator = [${exchangeProperty.loadedAlert[currentoperator]}]"
                                                    - method: choice
                                                      when:
                                                        - predicate:
                                                            type: simple
                                                            expression: "${exchangeProperty.loadedAlert[currentoperator]} == ${exchangeProperty.operator}"
                                                          steps:
                                                            - method: log
                                                              level: DEBUG
                                                              message: "Alert [${exchangeProperty.alertId}] is already assigned to the requested operator | Current Assigned Operator [${exchangeProperty.loadedAlert[currentoperator]}] | Requested Operator [${exchangeProperty.operator}]"
                                                            - method: setProperty
                                                              key: actionResponses
                                                              value:
                                                                type: groovy
                                                                expression: |
                                                                  def responses = exchange.properties.get('actionResponses') ?: []
                                                                  responses.add([
                                                                    status: 409,
                                                                    action: 'DROPPED',
                                                                    actionType: 'assignAlert',
                                                                    message: "Alert [${exchange.properties.get('alertId')}] is already assigned to the requested operator | Current Assigned Operator [${exchange.properties.get('loadedAlert')?.get('currentoperator')}] | Requested Operator [${exchange.properties.get('operator')}]".toString()
                                                                  ])
                                                                  return responses
                                                      otherwise:
                                                        - method: choice
                                                          when:
                                                            - predicate:
                                                                type: simple
                                                                expression: "${exchangeProperty.loadedAlert[currentoperator]} != '--'"
                                                              steps:
                                                                - method: log
                                                                  level: DEBUG
                                                                  message: "Alert is currently assigned to [${exchangeProperty.loadedAlert[currentoperator]}] -- Deassigning alert before reassigning to [${exchangeProperty.operator}]"
                                                                - method: setProperty
                                                                  key: deassignAlertString
                                                                  value:
                                                                    type: simple
                                                                    expression: '<A><alertId>${exchangeProperty.alertId}</alertId><currentOperator>--</currentOperator><timeAssigned></timeAssigned><timeAccepted></timeAccepted><timeDeassigned>${exchangeProperty.eventDateTimestamp}</timeDeassigned><type>11</type><_originkey>${exchangeProperty.loadedAlert[_originkey]}</_originkey></A>'
                                                                - method: setProperty
                                                                  key: internalProcessedMessage
                                                                  value:
                                                                    type: simple
                                                                    expression: ${exchangeProperty.deassignAlertString}
                                                                - method: setBody
                                                                  expression:
                                                                    type: simple
                                                                    expression: "${exchangeProperty.internalProcessedMessage}"
                                                                # Send deassign to AlertServer
                                                                - method: to
                                                                  component: netty
                                                                  properties:
                                                                    protocol: tcp
                                                                    host: "$[[alertServerHost]]"
                                                                    port: "$[[alertServerPort]]"
                                                                    clientMode: true
                                                                    reconnect: true
                                                                    producerPoolEnabled: true
                                                                    sync: true
                                                                    textline: true
                                                                - method: log
                                                                  level: DEBUG
                                                                  message: "Response code from AlertServer [${body}]"
                                                                - method: choice
                                                                  when:
                                                                    - predicate:
                                                                        type: simple
                                                                        expression: "${body.startsWith('0')}"
                                                                      steps:
                                                                        - method: log
                                                                          level: DEBUG
