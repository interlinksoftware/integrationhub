                                                                actionType: 'runCommand',
                                                                message: "Command [${exchange.properties.get('command')}] with args [${exchange.properties.get('args')}] failed".toString(),
                                                                exitCode: exchange.getMessage().getHeader('CamelExecExitValue'),
                                                                response: exchange.getMessage().getBody()?.toString(),
                                                                payload: [
                                                                  exitCode: exchange.getMessage().getHeader('CamelExecExitValue'),
                                                                  response: exchange.getMessage().getBody()?.toString()
                                                                ]
                                                              ])
                                                              return responses
                                                        - method: log
                                                          level: DEBUG
                                                          message: "Aggregated action responses: ${exchangeProperty.actionResponses}"
                                            - method: setBody
                                              expression:
                                                type: groovy
                                                expression: |
                                                  def responses = exchange.properties.get('actionResponses') ?: []
                                                  def hasFailures = responses.any { response ->
                                                    ((response.get('status') ?: 200) as int) >= 400
                                                  }
                                                  return [
                                                    status: hasFailures ? 400 : 200,
                                                    action: hasFailures ? 'FAILED' : 'COMPLETED',
                                                    requestId: exchange.properties.get('parentId'),
                                                    alertId: exchange.properties.get('alertId'),
                                                    responses: responses
                                                  ]
                                            - method: marshal
                                              type: json
                                            - method: setHeader
                                              key: splitActionResponseJson
                                              value:
                                                type: simple
                                                expression: "${bodyAs(String)}"
                                            - method: log
                                              level: DEBUG
                                              message: "Split child action response body: ${bodyAs(String)}"
                                      otherwise:
                                        - method: log
                                          level: "DEBUG"
                                          message: "Alert with id [${exchangeProperty.alertId}] is closed. Not processing any further."
                                        - method: isslog
                                          message: "parentId=${exchange.properties[parentId]} | dropped() | Not processing any further as Alert with id [${exchangeProperty.alertId}] is closed"
                                          type: dropped
                                          queueSize: $[[uiMessageLimit]]
                                          writeToFile: $[[logDropped]]
                                          writeToDatabase: $[[logDropped]]
                                          writeToDatahub: $[[logDroppedToDatahub]]
                                          datahubDataSource: $[[logDatahubDataSource]]
                                        - method: setBody
                                          expression:
                                            type: simple
                                            expression: '{"status": 400, "action": "DROPPED", "requestId": "${exchange.properties[parentId]}", "message": "Not processing any further as Alert with id [${exchangeProperty.alertId}] is closed"}'
                          otherwise:
                            - method: log
                              level: "WARN"
                              message: "filters expression(${exchangeProperty.filterExpression}) does not match"
                            - method: setProperty
                              key: filterCheck
                              value:
                                type: groovy
                                expression: |
                                  prop = exchange.properties.getOrDefault("filterCheck", "NOT_SET")
                                  if (prop == "NOT_SET") {
                                    return false;
                                  } else {
                                    return prop;
                                  }
                            - method: setProperty
                              key: filterLoopIndex
                              value:
                                type: "groovy"
                                expression: |
                                  def loopIndex = exchange.properties.get('filterLoopIndex') as int;
                                  return loopIndex + 1
              otherwise:
                - method: log
                  level: "ERROR"
                  message: "No filter definitions"
                - method: setProperty
                  key: filterCheck
                  value:
                    type: "constant"
                    expression: false

                - method: choice
                  when:
                    - predicate:
                        type: "simple"
                        expression: "${exchangeProperty.filterCheck.toString()} =~ 'false'"
                      steps:
                        - method: log
                          level: "DEBUG"
                          message: "writing to dropped file"
                        # REF-4UJ - Write log message to file
                        - method: isslog
                          message: "parentId=${exchange.properties[parentId]} | dropped() | No filter definitions were defined, or no matching definitions were found for the incoming message | ${bodyAs(String)}"
                          type: dropped
                          queueSize: $[[uiMessageLimit]]
                          writeToFile: $[[logDropped]]
                          writeToDatabase: $[[logDropped]]
                          writeToDatahub: $[[logDroppedToDatahub]]
                          datahubDataSource: $[[logDatahubDataSource]]
                        - method: setBody
                          expression:
                            type: simple
                            expression: '{"status": 400, "action": "DROPPED", "requestId": "${exchange.properties[parentId]}", "message": "No filter definitions were defined, or no matching definitions were found for the incoming message"}'

        # Build final action response using a Camel/Freemarker response template
        - method: choice
          when:
            - predicate:
                type: groovy
                expression: |
                  def aggregationResult = exchange.properties.get('AggregationResult')
                  if (aggregationResult instanceof List && aggregationResult.size() > 0) {
                    return aggregationResult.any { result ->
                      def bodyText = result?.body?.toString()
                      def headerText = result?.headers?.get('splitActionResponseJson')?.toString()
                      return bodyText?.contains('"responses"') || headerText?.contains('"responses"')
                    }
                  }

                  def bodyText = exchange.getMessage().getBody(String)
                  return bodyText != null && bodyText.contains('"responses"')
              steps:
                - method: log
                  level: DEBUG
                  message: "Building final response for the caller based on split result. AggregationResult=[${exchangeProperty.AggregationResult}], body=[${bodyAs(String)}]"
                - method: setHeader
                  key: actionResponseJson
                  value:
                    type: groovy
                    expression: |
                      import groovy.json.JsonOutput
                      import groovy.json.JsonSlurper

                      def defaultResponse = {
                        JsonOutput.toJson([
                          status: 200,
                          action: 'SUCCESS',
                          requestId: exchange.properties.get('parentId'),
                          message: 'Successfully processed the message',
                          alertId: exchange.properties.get('alertId') ?: ''
                        ])
                      }

                      def aggregationResult = exchange.properties.get('AggregationResult') ?: []
                      def responseBody = null

                      def matchingResult = null
                      if (aggregationResult instanceof List) {
                        matchingResult = aggregationResult.reverse().find { result ->
                          def bodyText = result?.body?.toString()
                          def headerText = result?.headers?.get('splitActionResponseJson')?.toString()
                          return bodyText?.contains('"responses"') || headerText?.contains('"responses"')
                        }
                      }

                      if (matchingResult != null) {
                        def bodyText = matchingResult.body?.toString()
                        if (bodyText != null && bodyText.contains('"responses"')) {
                          responseBody = matchingResult.body
                        } else {
                          responseBody = matchingResult.headers?.get('splitActionResponseJson')
                        }
                      }

                      if (responseBody == null || responseBody.toString().trim() == '') {
                        def currentBody = exchange.getMessage().getBody(String)
                        if (currentBody != null && currentBody.contains('"responses"')) {
                          responseBody = currentBody
                        }
                      }

                      if (responseBody == null || responseBody.toString().trim() == '') {
                        return defaultResponse()
                      }

                      if (responseBody instanceof String) {
                        def responseBodyString = responseBody.trim()

                        if (responseBodyString.contains('"responses"')) {
                          try {
                            new JsonSlurper().parseText(responseBodyString)
                            return responseBodyString
                          } catch (Exception ignored) {
                            return defaultResponse()
                          }
                        }

                        return defaultResponse()
                      }

                      return JsonOutput.toJson(responseBody)

                - method: setHeader
                  key: responseStatus
                  value:
                    type: groovy
                    expression: |
                      import groovy.json.JsonSlurper

                      def responseStatus = 200
                      try {
                        def response = new JsonSlurper().parseText(headers.actionResponseJson)
                        responseStatus = (response.status ?: 200) as int
                      } catch (Exception ignored) {
                        responseStatus = 200
                      }

                      return responseStatus >= 400 ? 'unsuccessful' : 'successful'

                - method: setHeader
                  key: httpResponseCode
                  value:
                    type: groovy
                    expression: |
                      if (headers.responseStatus == 'partial') {
                        return '206'
                      }

                      return headers.responseStatus == 'unsuccessful' ? '500' : '200'

                - method: setProperty
                  key: httpResponseCode
                  value:
                    type: simple
                    expression: "${headers.httpResponseCode}"

                - method: setHeader
                  key: returnCode
                  value:
                    type: groovy
                    expression: |
                      if (headers.responseStatus == 'partial') {
                        return '1'
                      }

                      return headers.responseStatus == 'unsuccessful' ? '2' : '0'

                - method: setHeader
                  key: CamelFreemarkerTemplate
                  value:
                    type: "constant"
                    expression: |
                      <@compress single_line=true>
                        {
                          "status": "${headers.responseStatus}",
                          "returnCode": "${headers.returnCode}",
                          "http": {
                            "code": "${headers.httpResponseCode}",
                            "method": "${headers.CamelHttpMethod!"POST"}"
                          },
                          "data": ${headers.actionResponseJson}
                        }
                      </@compress>

                - method: to
                  component: freemarker
                  properties:
                    resourceUri: dummy
                    allowTemplateFromHeader: true
                    allowContextMapAll: true

                - method: process
                  classname: com.interlinksoftware.integrationhub.config.step.processor.RestoreOriginHeadersProcessor

                - method: setHeader
                  key: CamelHttpResponseCode
                  value:
                    type: simple
                    expression: "${exchangeProperty.httpResponseCode}"

                - method: log
                  level: DEBUG
                  message: "Final action response to be sent back to the caller: ${bodyAs(String)}"
          otherwise:
            # No actions ran. An item that was dropped or failed (allow/deny list, no matching filter, alert not found
            # or closed, AlertServer unreachable) leaves its JSON status body - return the last one to the caller
            - method: setProperty
              key: itemResponse
              value:
                type: groovy
                expression: |
                  import groovy.json.JsonSlurper

                  def results = exchange.properties.get('AggregationResult')
                  if (!(results instanceof List)) {
                    return null
                  }
                  for (result in results.reverse()) {
                    def text = result?.body?.toString()?.trim()
                    if (text?.startsWith('{')) {
                      try {
                        def parsed = new JsonSlurper().parseText(text)
                        if (parsed instanceof Map && parsed.containsKey('status')) {
                          return text
                        }
                      } catch (Exception ignored) {
                      }
                    }
                  }
                  return null
            - method: choice
              when:
                - predicate:
                    type: simple
                    expression: "${exchangeProperty.itemResponse} != null"
                  steps:
                    - method: log
                      level: DEBUG
                      message: "No actions were run. Returning the item response -- ${exchangeProperty.itemResponse}"
                    - method: setBody
                      expression:
                        type: simple
                        expression: "${exchangeProperty.itemResponse}"
                    # A numeric status (e.g. 400) is the HTTP code, a text status (e.g. dropped) is returned as 200
                    - method: setHeader
                      key: CamelHttpResponseCode
                      value:
                        type: groovy
                        expression: |
                          def status = new groovy.json.JsonSlurper().parseText(exchange.properties.get('itemResponse')).status
                          return status instanceof Number ? status.intValue() : 200
              otherwise:
                - method: log
                  level: DEBUG
                  message: "No split aggregation result was generated from processing the message. Returning a successful response by default -- ${exchangeProperty.AggregationResult}"
                - method: setBody
                  expression:
                    type: simple
                    expression: '{"status": 200, "action": "SUCCESS", "requestId": "${exchange.properties[parentId]}", "message": "Successfully processed the message", "alertId": "${exchange.properties[alertId]}"}'
